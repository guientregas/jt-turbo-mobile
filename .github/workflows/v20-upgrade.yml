name: Upgrade V20
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upgrade:
    if: github.event.head_commit.message != 'V20: aplicar melhorias de endereco mapa municipal e WhatsApp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V20
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('v20/index.html')
          s=p.read_text()
          # visual polish + utility buttons
          s=s.replace('.pkgactions .btn{min-height:37px;font-size:9px}', '.pkgactions .btn{min-height:37px;font-size:9px}.verify{font-size:9px;color:#8a5a12;background:#fff7e7;border:1px solid #efd9a8;border-radius:9px;padding:8px;margin-top:6px}.mini{font-size:8px!important;min-height:34px!important}')
          # replace address engine: CEP + Nominatim + ArcGIS, strict Valparaiso filter
          start=s.index('function normalize(s)')
          end=s.index('function current()',start)
          engine=r'''function normalize(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function cepOf(s){let m=String(s||'').match(/\b(\d{5})[- .]?(\d{3})\b/);return m?m[1]+m[2]:''}
async function viaCep(cep){if(!/^\d{8}$/.test(cep))return null;try{let r=await fetch('https://viacep.com.br/ws/'+cep+'/json/');if(!r.ok)return null;let j=await r.json();return j.erro?null:j}catch(e){return null}}
function parseAddress(o){let raw=String(o.address||'').trim(),num=String(o.number||'').trim(),cep=cepOf(raw);raw=raw.replace(/\b\d{5}[- .]?\d{3}\b/,'').trim();if(!num){let m=raw.match(/^(.*?)[, ]+(\d+[A-Za-z]?)$/);if(m){raw=m[1].trim();num=m[2]}}return{street:raw,number:num,sector:String(o.sector||'').trim(),cep}}
async function nominatim(q){try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=8&countrycodes=br&accept-language=pt-BR&q='+encodeURIComponent(q),{headers:{Accept:'application/json'}});return r.ok?await r.json():[]}catch(e){return[]}}
async function arcgis(q){try{let u='https://geocode-api.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=json&maxLocations=8&outFields=*&singleLine='+encodeURIComponent(q);let r=await fetch(u);if(!r.ok)return[];let j=await r.json();return(j.candidates||[]).map(c=>({lat:c.location?.y,lng:c.location?.x,display_name:c.address||'',address:{city:c.attributes?.City,road:c.attributes?.Address,house_number:c.attributes?.HouseNumber,suburb:c.attributes?.Neighborhood,postcode:c.attributes?.Postal}})).filter(x=>x.lat!=null)}catch(e){return[]}}
function scoreCandidate(x,o,via){let a=x.address||{},city=normalize(a.city||a.town||a.municipality||a.village||''),road=normalize(a.road||a.street||''),p=parseAddress(o),sc=0;if(city.includes('valparaiso de goias'))sc+=70;else return -999;if(p.sector&&normalize(a.suburb||a.neighbourhood||a.district||'').includes(normalize(p.sector)))sc+=20;if(p.street){let t=normalize(p.street);if(road===t)sc+=30;else if(road&&t&&(road.includes(t)||t.includes(road)))sc+=18}if(p.number&&String(a.house_number||'')===p.number)sc+=35;if(via&&normalize(via.logradouro)===road)sc+=15;return sc}
async function findAddressCandidates(o){let p=parseAddress(o);if(p.cep){let v=await viaCep(p.cep);if(v&&normalize(v.localidade).includes('valparaiso')){o.cep=v.cep;o.address=v.logradouro||o.address;o.sector=v.bairro||o.sector;p=parseAddress(o)}}if(!p.street)return[];let qs=[[p.street,p.number,p.sector,'Valparaiso de Goias','GO','Brasil'].filter(Boolean).join(', '),[p.street,p.sector,'Valparaiso de Goias','GO','Brasil'].filter(Boolean).join(', '),[p.street,'Valparaiso de Goias','GO','Brasil'].join(', ')],all=[];for(const q of qs){let [a,b]=await Promise.all([nominatim(q),arcgis(q)]);all.push(...a,...b)}let seen=new Set(),out=[];for(const x of all){let k=(+x.lat).toFixed(6)+','+(+x.lng).toFixed(6);if(seen.has(k))continue;seen.add(k);let sc=scoreCandidate(x,o,null);if(sc>=70)out.push({...x,score:sc})}return out.sort((a,b)=>b.score-a.score).slice(0,8)}
async function geocode(o){if(o.lat!=null&&o.lng!=null)return true;if(!o.address)return false;toast('Consultando CEP e mapas de Valparaíso...');let c=await findAddressCandidates(o);if(!c.length){toast('Endereço não confirmado. Use FIXAR NO MAPA.');return false}if(c[0].score<105){showAddressChoices(o,c);return false}o.lat=+c[0].lat;o.lng=+c[0].lng;o.geocodeSource='Busca cruzada';o.geocodeLabel=c[0].display_name;save();render();draw();return true}
function showAddressChoices(o,c){showModal('🔎 Confirmar endereço','<div class="verify">O app não vai escolher silenciosamente uma rua/quadra errada. Escolha o resultado correto ou fixe o ponto manualmente.</div>'+c.map((x,i)=>'<div class="pkg"><b>'+esc(x.display_name)+'</b><div class="sub">Conferência: '+x.score+'/125</div><button class="btn primary mini" data-choice="'+i+'">USAR ESTE PONTO</button></div>').join('')+'<button id="manualChoice" class="btn loc" style="width:100%">📍 FIXAR NO MAPA</button>');$('modalBody').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let x=c[+b.dataset.choice];o.lat=+x.lat;o.lng=+x.lng;o.fixed=true;o.geocodeSource='Confirmado pelo entregador';o.geocodeLabel=x.display_name;save();closeModal();render();draw();toast('✓ Ponto confirmado')});$('manualChoice').onclick=()=>{closeModal();manualPin(o)}}
function manualPin(o){showModal('📍 Fixar ponto exato','<div class="verify"><b>Para beco, lote, casa sem placa ou endereço não encontrado:</b> toque exatamente no local no mapa. Esta coordenada passa a ser a referência da entrega.</div><div id="pinMap" style="height:420px;border-radius:12px;overflow:hidden"></div><div id="pinRead" class="note">Toque no mapa para marcar.</div><button id="savePin" class="btn primary" style="width:100%">SALVAR PONTO EXATO</button>');setTimeout(()=>{let pm=L.map('pinMap').setView(o.lat!=null?[o.lat,o.lng]:CENTER,o.lat!=null?19:16),mk=o.lat?L.marker([o.lat,o.lng]).addTo(pm):null;L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20}).addTo(pm);pm.on('click',e=>{if(mk)mk.remove();mk=L.marker(e.latlng).addTo(pm);$('pinRead').textContent='📍 '+e.latlng.lat.toFixed(6)+', '+e.latlng.lng.toFixed(6)});$('savePin').onclick=()=>{if(!mk)return toast('Toque no ponto correto.');let q=mk.getLatLng();o.lat=q.lat;o.lng=q.lng;o.fixed=true;o.geocodeSource='Pino manual';o.geocodeLabel='Ponto escolhido no mapa';save();closeModal();render();draw();toast('✓ Ponto exato salvo')};setTimeout(()=>pm.invalidateSize(),200)},80)}
function streetView(o){if(o.lat==null)return toast('Confirme o ponto primeiro.');window.open('https://www.google.com/maps/@?api=1&map_action=pano&viewpoint='+o.lat+','+o.lng,'_blank')}
function satellite(o){let q=o.lat!=null?o.lat+','+o.lng:encodeURIComponent(address(o));window.open('https://www.google.com/maps/@'+q+',20z/data=!3m1!1e3','_blank')}
'''
          s=s[:start]+engine+s[end:]
          # better WhatsApp instruction
          s=re.sub(r"function whatsText\(o\)\{.*?\}", "function whatsText(o){return 'Olá, '+(o.name||'')+'! 👋 Sou da J&T Turbo.\\n\\nPara eu chegar certinho: toque no 📎 → Localização → Enviar sua localização atual.\\n\\nSe tiver um ponto fixo na entrada, pode enviar também. Obrigado!' }", s, count=1)
          # municipal PDF inside modal instead of two popups
          s=re.sub(r"function municipal\(\)\{.*?\}\nfunction fit", "function municipal(){showModal('🏛️ Mapa municipal de Valparaíso','<div class=\\\"verify\\\">PDF oficial dentro do app. Se o iPhone não renderizar, abra em tela cheia.</div><iframe src=\\\"'+MUNICIPAL+'#view=FitH\\\" style=\\\"width:100%;height:72vh;border:0;border-radius:12px\\\"></iframe><div style=\\\"display:flex;gap:6px;margin-top:7px\\\"><button class=\\\"btn primary\\\" id=\\\"openMunicipalPdf\\\">ABRIR PDF COMPLETO</button><button class=\\\"btn loc\\\" id=\\\"openIbgePdf\\\">MAPA IBGE</button></div>');$('openMunicipalPdf').onclick=()=>window.open(MUNICIPAL,'_blank');$('openIbgePdf').onclick=()=>window.open(IBGE,'_blank')}\nfunction fit", s, count=1, flags=re.S)
          # edit bug + preserve WhatsApp fixed point
          s=s.replace("if(ad!==o.address)o.lat=o.lng=undefined", "if(!o.fixed&&(ad!==oldAddress||newNum!==oldNumber||newSector!==oldSector)){o.lat=undefined;o.lng=undefined;delete o.geocodeLabel;delete o.geocodeSource}")
          # inject old vars in edit handler if present
          s=s.replace("o.name=n;o.phone=p;o.address=ad;o.number=$('fnum').value.trim();o.complement=$('fc').value.trim();o.sector=$('fs').value.trim();", "const oldAddress=o.address||'',oldNumber=o.number||'',oldSector=o.sector||'',newNum=$('fnum').value.trim(),newSector=$('fs').value.trim();o.name=n;o.phone=p;o.address=ad;o.number=newNum;o.complement=$('fc').value.trim();o.sector=newSector;")
          # add address/satellite/street buttons to package rows
          needle="<button class=\"btn loc\" data-c=\"paste\" data-id=\"'+o.id+'\">📋 COLAR MAPA DO WHATS</button>"
          repl=needle+"<button class=\"btn loc mini\" data-c=\"find\" data-id=\"'+o.id+'\">🔎 BUSCAR ENDEREÇO</button><button class=\"btn loc mini\" data-c=\"pin\" data-id=\"'+o.id+'\">📍 FIXAR PONTO</button><button class=\"btn loc mini\" data-c=\"street\" data-id=\"'+o.id+'\">🏠 FACHADA</button><button class=\"btn loc mini\" data-c=\"sat\" data-id=\"'+o.id+'\">🛰️ SATÉLITE</button>"
          s=s.replace(needle,repl)
          s=s.replace("case'paste':paste(o.id);break;case'go':navigate(o);break;", "case'paste':paste(o.id);break;case'find':geocode(o);break;case'pin':manualPin(o);break;case'street':streetView(o);break;case'sat':satellite(o);break;case'go':navigate(o);break;")
          p.write_text(s)
          PY
      - name: Commit patched V20
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v20/index.html .github/workflows/v20-upgrade.yml
          git diff --cached --quiet || git commit -m 'V20: precisao de endereco mapa municipal e WhatsApp'
          git push
