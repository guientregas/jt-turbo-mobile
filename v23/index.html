<!doctype html><html lang=pt-BR><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name=theme-color content=#087cff><title>J&T Turbo V23</title><link rel=stylesheet href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172033;font:14px Arial}.top{background:#087cff;color:white;padding:14px;position:sticky;top:0;z-index:5}.wrap{max-width:1100px;margin:auto;padding:10px}.brand{font-size:22px;font-weight:900}.gps{float:right;font-size:11px}.card{background:white;border:1px solid #dfe6ef;border-radius:14px;margin:10px 0;padding:12px}.grid{display:grid;grid-template-columns:330px 1fr;gap:10px}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}button{border:0;border-radius:10px;background:#087cff;color:#fff;font-weight:800;padding:12px;min-height:45px;cursor:pointer;touch-action:manipulation}button.green{background:#0a9b67}button.red{background:#d84e5d}button.gold{background:#b97800}button.dark{background:#172033}.small{font-size:11px;color:#68778b;line-height:1.5}.counts{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin:10px -12px -12px;border-top:1px solid #e4e9ef}.counts b{display:block;font-size:22px}.counts div{padding:8px}.map{height:460px;border-radius:10px;overflow:hidden}.pkg{border-top:1px solid #e4e9ef;padding:12px 0}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.actions button{font-size:10px;padding:8px}.field{width:100%;padding:12px;margin:5px 0;border:1px solid #dbe3ed;border-radius:9px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.modal.on{display:flex}.sheet{background:#fff;width:100%;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#172033;color:white;padding:11px 14px;border-radius:10px;display:none;z-index:30;max-width:90%;text-align:center}.toast.on{display:block}.result{padding:9px;border:1px solid #ddd;border-radius:9px;margin-top:7px}.pdf{height:65vh;width:100%;border:0}@media(max-width:760px){.grid{grid-template-columns:1fr}.map{height:390px}.actions{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class=top><div class=wrap><span class=brand>🚚 J&T TURBO</span><span id=gps class=gps>📍 Localizando...</span></div></header><main class=wrap><button id=start style="width:100%;font-size:16px">▶ COMEÇAR ROTA</button><section class=card><b>Entregas de hoje</b><div id=summary class=small>Nenhuma entrega.</div><div class=counts><div><b id=pending>0</b>PENDENTES</div><div><b id=done>0</b>ENTREGUES</div><div><b id=failed>0</b>NÃO ENTREGUES</div></div></section><section class=card><b>PRÓXIMA ENTREGA</b><div id=nextName>Nenhum pacote</div><div id=nextAddr class=small>Cadastre uma entrega.</div><div id=confidence class=small></div><div class=actions><button id=go>🧭 IR</button><button id=arrive>📍 CHEGUEI</button><button id=deliver class=green>✓ ENTREGUE</button><button id=facade>🏠 FACHADA</button></div><button id=finish class=gold style="width:100%;margin-top:7px">✓ FINALIZAR ROTA</button></section><div class=grid><div><section class=card><b>Adicionar</b><div class=small>Endereço escrito ou localização enviada pelo WhatsApp.</div><div class=buttons><button id=manual>＋ MANUAL</button><button id=import>📥 IMPORTAR</button><button id=photo>📷 FOTO</button><button id=paste>📍 COLAR WHATS</button></div></section><section class=card><b>Ferramentas</b><div class=buttons><button id=mapBtn>🗺️ MAPA</button><button id=municipal>🏛️ MUNICIPAL</button><button id=history>🕘 HISTÓRICO</button><button id=search>🔎 BUSCAR</button><button id=sat>🛰️ SATÉLITE</button><button id=gas>⛽ POSTOS</button></div></section><section class=card><b>🔎 Localizador inteligente</b><input id=quick class=field placeholder="Rua, quadra, lote, bairro ou CEP"><button id=quickGo style="width:100%">LOCALIZAR</button><div id=results></div></section></div><div><section class=card><b>📦 Pacotes <span id=total class=small></span></b><div id=list></div></section><section class=card><b>🗺️ MAPA DA ROTA</b><div id=status class=small>Obtendo GPS...</div><div id=map class=map></div><div class=buttons style="margin-top:7px"><button id=reload>📍 MINHA LOCALIZAÇÃO</button><button id=openGoogle>🌐 GOOGLE MAPS</button><button id=all>🎯 TODAS ENTREGAS</button></div></section></div></div></main><input id=file type=file accept=.csv,.txt,.json hidden><input id=camera type=file accept="image/*" capture=environment hidden><input id=pdfFile type=file accept=application/pdf hidden><div id=modal class=modal><div class=sheet><h3 id=mt></h3><div id=mb></div><button id=close style="width:100%;margin-top:8px">FECHAR</button></div></div><div id=toast class=toast></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>(function(){var K='jtTurboV23',D=load(),P=null,M,ME,MS=[],pdf=null;function E(x){return document.getElementById(x)}function load(){try{var x=JSON.parse(localStorage.getItem(K)||'{}');return{orders:x.orders||[],history:x.history||[]}}catch(e){return{orders:[],history:[]}}}function save(){localStorage.setItem(K,JSON.stringify(D))}function toast(t){E('toast').textContent=t;E('toast').className='toast on';clearTimeout(window.tt);window.tt=setTimeout(function(){E('toast').className='toast'},2800)}function esc(x){return String(x||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function modal(t,b){E('mt').textContent=t;E('mb').innerHTML=b;E('modal').className='modal on'}function close(){E('modal').className='modal'}function pend(){return D.orders.filter(function(o){return o.status!=='done'&&o.status!=='failed'})}function next(){return pend()[0]}function get(id){return D.orders.find(function(o){return String(o.id)===String(id)})}function ext(u){var w=window.open(u,'_blank');if(!w)location.href=u}function addr(o){return[o.address,o.number,o.sector,o.cep,'Valparaíso de Goiás','GO','Brasil'].filter(Boolean).join(', ')}function gUrl(o){return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(addr(o))}function init(){M=L.map('map').setView([-16.065,-47.975],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap'}).addTo(M)}function pin(lat,lng,html){return L.marker([lat,lng]).addTo(M).bindPopup(html)}function pins(){MS.forEach(function(x){M.removeLayer(x)});MS=[];D.orders.forEach(function(o){if(isFinite(+o.lat)&&isFinite(+o.lng))MS.push(pin(+o.lat,+o.lng,'<b>📦 '+esc(o.name)+'</b><br>'+esc(addr(o))+'<br><button onclick="nav(\''+o.id+'\')">🧭 IR</button>'))});if(P){if(ME)M.removeLayer(ME);ME=pin(P.lat,P.lng,'<b>📍 VOCÊ ESTÁ AQUI</b><br>Precisão: '+Math.round(P.acc)+' m');ME.setIcon(L.divIcon({html:'<div style="font-size:28px">🔵</div>',className:'',iconSize:[28,28],iconAnchor:[14,14]}))}}function gps(){if(!navigator.geolocation)return toast('GPS indisponível');navigator.geolocation.getCurrentPosition(function(p){P={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};E('gps').textContent='📍 '+P.lat.toFixed(5)+', '+P.lng.toFixed(5);E('status').textContent='📍 Você está aqui • precisão ~'+Math.round(P.acc)+' m';M.setView([P.lat,P.lng],16);pins()},function(){E('gps').textContent='📍 GPS bloqueado';toast('Permita a localização do navegador.')},{enableHighAccuracy:true,timeout:20000,maximumAge:3000})}function geo(q,cb){fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&addressdetails=1&countrycodes=br&q='+encodeURIComponent(q)).then(function(r){return r.json()}).then(cb).catch(function(){toast('Falha ao consultar endereço')})}function locate(o){geo(addr(o),function(r){if(!r.length)return toast('Endereço não localizado. Peça a localização do WhatsApp.');var x=r[0];o.lat=+x.lat;o.lng=+x.lon;o.display=x.display_name;o.confidence=80;save();render();M.setView([o.lat,o.lng],18);pins();toast('✓ Endereço localizado')})}function nav(id){var o=get(id);if(!o)return;if(isFinite(+o.lat)&&isFinite(+o.lng))ext('https://www.google.com/maps/dir/?api=1&destination='+o.lat+','+o.lng+'&travelmode=driving&dir_action=navigate');else locate(o)}function wa(o){ext('https://wa.me/'+String(o.phone||'').replace(/\D/g,'')+'?text='+encodeURIComponent('Olá, '+o.name+'! 👋 Envie sua localização atual pelo WhatsApp para eu chegar certinho.'))}function form(edit){var o=edit?get(edit):null;modal(edit?'EDITAR ENTREGA':'NOVA ENTREGA','<input id=fn class=field placeholder="Nome *" value="'+esc(o&&o.name)+'"><input id=fp class=field placeholder="WhatsApp *" value="'+esc(o&&o.phone)+'"><input id=fa class=field placeholder="Rua / avenida / chácara" value="'+esc(o&&o.address)+'"><input id=fi class=field placeholder="Número / lote / casa" value="'+esc(o&&o.number)+'"><input id=fs class=field placeholder="Bairro / setor / quadra" value="'+esc(o&&o.sector)+'"><input id=fc class=field placeholder="CEP" value="'+esc(o&&o.cep)+'"><div class=buttons><button id=sv>SALVAR</button><button id=loc>🔎 LOCALIZAR</button><button id=me>📍 USAR MINHA POSIÇÃO</button><button id=req>💬 PEDIR LOCALIZAÇÃO</button></div>');E('sv').onclick=function(){var n=E('fn').value.trim(),p=E('fp').value.trim();if(!n||!p)return toast('Nome e WhatsApp são obrigatórios');var x=o||{id:String(Date.now()),status:'pending'};x.name=n;x.phone=p;x.address=E('fa').value.trim();x.number=E('fi').value.trim();x.sector=E('fs').value.trim();x.cep=E('fc').value.trim();if(!o)D.orders.push(x);save();close();render();if(x.address||x.sector||x.cep)locate(x)};E('loc').onclick=function(){var q=[E('fa').value,E('fi').value,E('fs').value,E('fc').value,'Valparaíso de Goiás GO Brasil'].filter(Boolean).join(', ');geo(q,function(r){if(!r.length)return toast('Não localizado');var x=r[0],z=o||{id:String(Date.now()),name:E('fn').value.trim(),phone:E('fp').value.trim(),status:'pending'};z.address=E('fa').value.trim();z.number=E('fi').value.trim();z.sector=E('fs').value.trim();z.cep=E('fc').value.trim();z.lat=+x.lat;z.lng=+x.lon;z.display=x.display_name;z.confidence=80;if(!o)D.orders.push(z);save();close();render();M.setView([z.lat,z.lng],18);pins()})};E('me').onclick=function(){if(!P)return gps();var z=o||{id:String(Date.now()),name:E('fn').value.trim(),phone:E('fp').value.trim(),status:'pending'};z.lat=P.lat;z.lng=P.lng;z.fixed=true;if(!o)D.orders.push(z);save();close();render();pins()};E('req').onclick=function(){wa({name:E('fn').value.trim(),phone:E('fp').value.trim()})}}function render(){var p=pend(),n=next();E('pending').textContent=p.length;E('done').textContent=D.orders.filter(function(o){return o.status==='done'}).length;E('failed').textContent=D.orders.filter(function(o){return o.status==='failed'}).length;E('summary').textContent=p.length?p.length+' pendente(s)':'Nenhuma entrega.';E('nextName').textContent=n?n.name:'Nenhum pacote';E('nextAddr').textContent=n?addr(n):'Cadastre uma entrega.';E('confidence').textContent=n&&n.confidence?'📍 confiança aproximada '+n.confidence+'%':'';E('total').textContent=D.orders.length+' total';E('list').innerHTML=D.orders.length?D.orders.map(function(o){var c=isFinite(+o.lat)&&isFinite(+o.lng);return'<div class=pkg><b>'+esc(o.name)+'</b><div class=small>📱 '+esc(o.phone)+'</div><div class=small>📍 '+esc([o.address,o.number,o.sector,o.cep].filter(Boolean).join(', ')||'Sem endereço')+'</div><div class=small>'+(c?'✓ ponto no mapa':'⚠ sem coordenadas')+'</div><div class=actions><button onclick="form(\''+o.id+'\')">✏️ EDITAR</button><button onclick="wa(get(\''+o.id+'\'))">💬 WHATS</button><button onclick="paste(\''+o.id+'\')">📍 COLAR</button><button onclick="findPkg(\''+o.id+'\')">🔎 ACHAR</button><button onclick="fix(\''+o.id+'\')">📌 FIXAR</button><button onclick="nav(\''+o.id+'\')">🧭 IR</button><button onclick="facade(\''+o.id+'\')">🏠 FACHADA</button><button class=green onclick="done(\''+o.id+'\')">✓ ENTREGUE</button><button class=red onclick="fail(\''+o.id+'\')">✕ NÃO</button></div></div>'}).join(''):'<div class=small style="padding:20px;text-align:center">Nenhuma entrega cadastrada.</div>';pins()}function paste(id){var o=get(id),t=prompt('Cole link do WhatsApp ou latitude,longitude');if(!o||!t)return;var m=t.match(/(-?\d{1,3}\.\d{4,})\s*[,; ]\s*(-?\d{1,3}\.\d{4,})/)||t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);if(!m)return toast('Coordenadas não encontradas');o.lat=+m[1];o.lng=+m[2];o.fixed=true;save();render();M.setView([o.lat,o.lng],19);toast('✓ Localização salva')}function fix(id){var o=get(id),t=prompt('Latitude,longitude');if(!o||!t)return;var m=t.replace(';',',').match(/^(-?\d+(?:\.\d+)?)[, ]+(-?\d+(?:\.\d+)?)$/);if(!m)return toast('Ex.: -16.123456,-47.123456');o.lat=+m[1];o.lng=+m[2];o.fixed=true;save();render();toast('✓ Ponto fixado')}function findPkg(id){var o=get(id);if(!o)return;if(isFinite(+o.lat)&&isFinite(+o.lng)){M.setView([o.lat,o.lng],19);pins();return}locate(o)}function facade(id){var o=get(id);if(o)ext(gUrl(o))}function done(id){var o=get(id);if(o){o.status='done';D.history.push(JSON.parse(JSON.stringify(o)));save();render();toast('✓ Entregue')}}function fail(id){var o=get(id);if(o){o.status='failed';D.history.push(JSON.parse(JSON.stringify(o)));save();render();toast('Não entregue registrado')}}function quick(){var q=E('quick').value.trim();if(!q)return toast('Digite o endereço');geo(q+', Valparaíso de Goiás, GO, Brasil',function(r){window.R=r;E('results').innerHTML=r.map(function(x,i){return'<div class=result><b>'+(i+1)+'.</b> '+esc(x.display_name)+'<br><button onclick="useR('+i+')">📍 USAR NA PRÓXIMA</button></div>'}).join('')||'Nenhum resultado';if(r[0])M.setView([+r[0].lat,+r[0].lon],18)})}function useR(i){var r=window.R[i],o=next();if(!o)return toast('Cadastre uma entrega');o.lat=+r.lat;o.lng=+r.lon;o.display=r.display_name;o.confidence=80;save();render();M.setView([o.lat,o.lng],19);toast('✓ Ponto aplicado')}function municipal(){modal('🏛️ MAPA MUNICIPAL','<div class=small>Seu PDF municipal contém ruas, quadras e setores de Valparaíso de Goiás. O desenho do PDF não possui, por si só, uma camada GPS para o navegador; por isso o app combina PDF + busca textual + mapa GPS.</div><div class=buttons style="margin-top:8px"><button id=pdf>📄 ABRIR PDF</button><button id=om>🗺️ MAPA GPS</button><button id=gm>🌐 GOOGLE MAPS</button></div><div id=pdfArea style="margin-top:8px">'+(pdf?'<iframe class=pdf src="'+pdf+'"></iframe>':'<div class=result>Toque em ABRIR PDF e selecione o mapa municipal salvo no celular.</div>')+'</div>');E('pdf').onclick=function(){E('pdfFile').click()};E('om').onclick=function(){ext('https://www.openstreetmap.org/#map=13/-16.065/-47.975')};E('gm').onclick=function(){ext('https://www.google.com/maps/search/?api=1&query=Valparaiso+de+Goias+GO')}}function hist(){modal('🕘 HISTÓRICO',(D.history||[]).map(function(o){return'<div class=pkg><b>'+esc(o.name)+'</b><div class=small>'+esc(addr(o))+'</div></div>'}).join('')||'Nenhum histórico')}function bind(){E('start').onclick=function(){var o=next();if(o)nav(o.id);else toast('Cadastre uma entrega')};E('go').onclick=function(){var o=next();if(o)nav(o.id)};E('arrive').onclick=function(){var o=next();if(o){o.arrivedAt=new Date().toISOString();save();toast('📍 CHEGUEI registrado')}};E('deliver').onclick=function(){var o=next();if(o)done(o.id)};E('facade').onclick=function(){var o=next();if(o)facade(o.id)};E('finish').onclick=function(){D.history=D.history.concat(D.orders.map(function(o){return JSON.parse(JSON.stringify(o))}));D.orders=[];save();render();toast('✓ Rota finalizada')};E('manual').onclick=function(){form()};E('mapBtn').onclick=function(){if(P)M.setView([P.lat,P.lng],17);else gps()};E('sat').onclick=function(){if(P)ext('https://www.google.com/maps/@?api=1&map_action=map&center='+P.lat+','+P.lng+'&zoom=18&basemap=satellite');else gps()};E('municipal').onclick=municipal;E('history').onclick=hist;E('search').onclick=function(){var o=next();if(o)findPkg(o.id)};E('gas').onclick=function(){ext('https://www.google.com/maps/search/?api=1&query=postos+Valparaiso+de+Goias')};E('reload').onclick=gps;E('openGoogle').onclick=function(){if(P)ext('https://www.google.com/maps/@?api=1&map_action=map&center='+P.lat+','+P.lng+'&zoom=17');else gps()};E('all').onclick=function(){var a=D.orders.filter(function(o){return isFinite(+o.lat)&&isFinite(+o.lng)}).map(function(o){return[+o.lat,+o.lng]});if(a.length)M.fitBounds(a,{padding:[30,30]});else toast('Nenhuma entrega geocodificada')};E('quickGo').onclick=quick;E('close').onclick=close;E('modal').onclick=function(e){if(e.target===E('modal'))close()};E('photo').onclick=function(){E('camera').click()};E('paste').onclick=function(){var o=next();if(o)paste(o.id)};E('import').onclick=function(){E('file').click()};E('pdfFile').onchange=function(e){var f=e.target.files[0];if(!f)return;if(pdf)URL.revokeObjectURL(pdf);pdf=URL.createObjectURL(f);close();municipal()};E('file').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){String(r.result).split(/\r?\n/).filter(Boolean).forEach(function(l){var a=l.split(/[;,]/);D.orders.push({id:String(Date.now())+Math.random(),name:a[0]||'Cliente',address:a[1]||'',number:a[2]||'',phone:a[3]||'',status:'pending'})});save();render();toast('✓ Importado')};r.readAsText(f)}}init();bind();render();gps()})();</script></body></html>
