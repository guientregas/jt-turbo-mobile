<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087cff"><title>J&T Turbo V23</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172033;font:14px Arial,sans-serif}.top{background:#087cff;color:#fff;padding:14px}.wrap{max-width:1050px;margin:auto;padding:10px}.brand{font-size:23px;font-weight:900}.gps{float:right;font-size:11px}.card{background:#fff;border:1px solid #dfe6ef;border-radius:14px;margin:10px 0;padding:12px}.title{font-weight:900;margin-bottom:7px}.grid{display:grid;grid-template-columns:330px 1fr;gap:10px}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}button{border:0;border-radius:10px;background:#087cff;color:#fff;font-weight:800;padding:12px;min-height:45px;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.98)}button.green{background:#0a9b67}button.red{background:#d84e5d}button.gold{background:#b97800}.counts{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin:10px -12px -12px;border-top:1px solid #e4e9ef}.counts div{padding:8px;border-right:1px solid #e4e9ef}.counts b{display:block;font-size:22px}.map{height:430px;width:100%;border-radius:10px;overflow:hidden;background:#dfe8ef}.map iframe{width:100%;height:100%;border:0}.pkg{border-top:1px solid #e4e9ef;padding:12px 0}.small{font-size:11px;color:#68778b;line-height:1.5}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.actions button{font-size:10px;padding:9px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:flex-end}.modal.on{display:flex}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}.field{width:100%;padding:12px;margin:5px 0;border:1px solid #dbe3ed;border-radius:9px}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:11px 14px;border-radius:10px;display:none;z-index:20;max-width:90%;text-align:center}.toast.on{display:block}.municipalFrame{height:65vh;width:100%;border:0;border-radius:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.map{height:360px}.actions{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><div class="wrap"><span class="brand">🚚 J&T TURBO</span><span id="gps" class="gps">📍 Localizando...</span></div></header><main class="wrap"><button id="start" style="width:100%;font-size:16px;margin-bottom:10px">▶ COMEÇAR ROTA</button><section class="card"><div class="title">Entregas de hoje</div><div id="summary" class="small">Nenhuma entrega.</div><div class="counts"><div><b id="pending">0</b>PENDENTES</div><div><b id="done">0</b>ENTREGUES</div><div><b id="failed">0</b>NÃO ENTREGUES</div></div></section><section class="card"><div class="title">PRÓXIMA ENTREGA</div><div id="nextName">Nenhum pacote</div><div id="nextAddr" class="small">Cadastre uma entrega.</div><div class="actions"><button id="go">🧭 IR</button><button id="arrive">📍 CHEGUEI</button><button id="deliver" class="green">✓ ENTREGUE</button></div><button id="finish" class="gold" style="width:100%;margin-top:7px">✓ FINALIZAR ROTA</button></section><div class="grid"><div><section class="card"><div class="title">Adicionar</div><div class="small">Nome + WhatsApp obrigatórios.</div><div class="buttons" style="margin-top:8px"><button id="manual">＋ MANUAL</button><button id="import">📥 IMPORTAR</button><button id="photo">📷 FOTO</button><button id="paste">📍 COLAR WHATS</button></div></section><section class="card"><div class="title">Ferramentas</div><div class="buttons"><button id="gas">⛽ POSTOS</button><button id="mapBtn">🗺️ MAPA</button><button id="municipal">🏛️ MUNICIPAL</button><button id="history">🕘 HISTÓRICO</button><button id="search">🔎 BUSCAR</button><button id="sat">🛰️ SATÉLITE</button></div></section></div><div><section class="card"><div class="title">📦 Pacotes <span id="total" class="small"></span></div><div id="list"></div></section><section class="card"><div class="title">🗺️ SUA LOCALIZAÇÃO</div><div id="mapStatus" class="small">Obtendo GPS...</div><div class="map"><iframe id="map" title="Mapa GPS" loading="eager"></iframe></div><div class="buttons" style="margin-top:8px"><button id="reload">📍 MINHA LOCALIZAÇÃO</button><button id="openGoogle">🌐 GOOGLE MAPS</button></div></section></div></div></main><input id="file" type="file" accept=".csv,.txt,.json" hidden><input id="camera" type="file" accept="image/*" capture="environment" hidden><div id="modal" class="modal"><div class="sheet"><h3 id="modalTitle"></h3><div id="modalBody"></div><button id="close" style="width:100%;margin-top:8px">FECHAR</button></div></div><div id="toast" class="toast"></div><script>(function(){'use strict';var KEY='jtTurboV23',data=load(),selected=null,pos=null;function E(x){return document.getElementById(x)}function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'{}');return{orders:x.orders||[],history:x.history||[]}}catch(e){return{orders:[],history:[]}}}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function toast(t){var x=E('toast');x.textContent=t;x.className='toast on';clearTimeout(window.tt);window.tt=setTimeout(function(){x.className='toast'},2500)}function modal(t,b){E('modalTitle').textContent=t;E('modalBody').innerHTML=b;E('modal').className='modal on'}function close(){E('modal').className='modal'}function esc(x){return String(x||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function pend(){return data.orders.filter(function(o){return o.status==='pending'||!o.status})}function next(){return pend()[0]}function pkg(id){return data.orders.find(function(o){return String(o.id)===String(id)})}function phone(p){var n=String(p||'').replace(/\D/g,'');if(n.length===10||n.length===11)n='55'+n;return n}function searchUrl(o){var q=o?[o.address,o.number,o.sector,'Valparaíso de Goiás','GO','Brasil'].filter(Boolean).join(', '):'Valparaíso de Goiás, GO, Brasil';return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}function external(u){var w=window.open(u,'_blank');if(!w)location.href=u}function bbox(a,b){var d=.04;return[(b-d).toFixed(6),(a-d).toFixed(6),(b+d).toFixed(6),(a+d).toFixed(6)].join('%2C')}function mapHere(){if(!pos){toast('GPS ainda não disponível.');return}var b=bbox(pos.lat,pos.lng);E('map').src='https://www.openstreetmap.org/export/embed.html?bbox='+b+'&layer=mapnik&marker='+pos.lat+'%2C'+pos.lng+'#map=16%2F'+pos.lat+'%2F'+pos.lng;E('mapStatus').textContent='📍 Você está aqui • precisão aproximada: '+Math.round(pos.acc)+' m'}function gps(){if(!navigator.geolocation){E('gps').textContent='📍 GPS indisponível';return}navigator.geolocation.getCurrentPosition(function(p){pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};E('gps').textContent='📍 '+pos.lat.toFixed(5)+', '+pos.lng.toFixed(5);mapHere()},function(){E('gps').textContent='📍 GPS bloqueado';E('mapStatus').textContent='Permita o acesso à localização do navegador.';toast('Permita o GPS para mostrar sua posição real.')},{enableHighAccuracy:true,timeout:15000,maximumAge:5000})}function render(){var p=pend(),n=next();E('pending').textContent=p.length;E('done').textContent=data.orders.filter(function(o){return o.status==='done'}).length;E('failed').textContent=data.orders.filter(function(o){return o.status==='failed'}).length;E('summary').textContent=p.length?p.length+' entrega(s) pendente(s)':'Nenhuma entrega.';E('nextName').textContent=n?n.name:'Nenhum pacote';E('nextAddr').textContent=n?[n.address,n.number,n.sector,'Valparaíso de Goiás','GO'].filter(Boolean).join(', '):'Cadastre uma entrega.';E('total').textContent=data.orders.length+' total';E('list').innerHTML=data.orders.length?data.orders.map(function(o){return'<div class="pkg"><b>'+esc(o.name)+'</b><div class="small">📱 '+esc(o.phone)+'</div><div class="small">📍 '+esc([o.address,o.number,o.sector].filter(Boolean).join(', ')||'Sem endereço')+'</div><div class="actions"><button onclick="editPkg(\''+o.id+'\')">✏️ EDITAR</button><button onclick="waPkg(\''+o.id+'\')">💬 WHATS</button><button onclick="pastePkg(\''+o.id+'\')">📍 COLAR</button><button onclick="searchPkg(\''+o.id+'\')">🔎 BUSCAR</button><button onclick="pinPkg(\''+o.id+'\')">📌 FIXAR</button><button onclick="navPkg(\''+o.id+'\')">🧭 IR</button><button class="green" onclick="donePkg(\''+o.id+'\')">✓ ENTREGUE</button><button class="red" onclick="failPkg(\''+o.id+'\')">✕ NÃO</button></div></div>'}).join(''):'<div class="small" style="padding:20px;text-align:center">Nenhuma entrega cadastrada.</div>'}function form(edit){var o=selected;modal(edit?'✏️ EDITAR ENTREGA':'＋ NOVA ENTREGA','<input id="fn" class="field" placeholder="Nome *" value="'+esc(o&&o.name)+'"><input id="fp" class="field" placeholder="WhatsApp *" value="'+esc(o&&o.phone)+'"><input id="fa" class="field" placeholder="Rua / avenida" value="'+esc(o&&o.address)+'"><input id="fnum" class="field" placeholder="Número / lote" value="'+esc(o&&o.number)+'"><input id="fs" class="field" placeholder="Bairro / setor / quadra" value="'+esc(o&&o.sector)+'"><button id="savePkg" style="width:100%">SALVAR</button>');E('savePkg').onclick=function(){var n=E('fn').value.trim(),p=E('fp').value.trim();if(!n||!p){toast('Nome e WhatsApp são obrigatórios.');return}var x=edit?o:{id:String(Date.now()),status:'pending'};x.name=n;x.phone=p;x.address=E('fa').value.trim();x.number=E('fnum').value.trim();x.sector=E('fs').value.trim();if(!edit)data.orders.push(x);else{delete x.lat;delete x.lng}save();close();render();toast('✓ Salvo')}}function add(){selected=null;form(false)}function editPkg(id){selected=pkg(id);if(selected)form(true)}function waPkg(id){var o=pkg(id);if(o)external('https://wa.me/'+phone(o.phone)+'?text='+encodeURIComponent('Olá, '+o.name+'! 👋 Sou da J&T Turbo. Envie sua localização atual pelo WhatsApp para eu chegar certinho.'))}function searchPkg(id){var o=pkg(id);if(o)external(searchUrl(o))}function navPkg(id){var o=pkg(id);if(!o)return;if(o.lat&&o.lng)external('https://www.google.com/maps/dir/?api=1&destination='+o.lat+','+o.lng+'&travelmode=driving&dir_action=navigate');else external(searchUrl(o))}function pastePkg(id){var o=pkg(id),t=prompt('Cole o link da localização do WhatsApp:');if(!o||!t)return;var m=t.match(/(-?\d{1,3}\.\d{4,})\s*[,; ]\s*(-?\d{1,3}\.\d{4,})/)||t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);if(!m){toast('Coordenadas não encontradas.');return}o.lat=+m[1];o.lng=+m[2];save();render();toast('✓ Localização salva')}function pinPkg(id){var o=pkg(id),t=prompt('Digite latitude,longitude:');if(!o||!t)return;var m=t.replace(';',',').match(/^(-?\d+(?:\.\d+)?)[, ]+(-?\d+(?:\.\d+)?)$/);if(!m){toast('Exemplo: -16.123456,-47.123456');return}o.lat=+m[1];o.lng=+m[2];save();render();toast('✓ Ponto fixado')}function donePkg(id){var o=pkg(id);if(o){o.status='done';data.history.push(o);save();render();toast('✓ Entregue')}}function failPkg(id){var o=pkg(id);if(o){o.status='failed';data.history.push(o);save();render();toast('Não entregue registrado')}}function start(){var o=next();if(!o){toast('Cadastre uma entrega primeiro.');return}navPkg(o.id)}function municipal(){modal('🏛️ MAPA MUNICIPAL','<div class="small">Mapa municipal sem usar sua localização como ponto falso.</div><div class="buttons"><button id="mg">🌐 GOOGLE MAPS</button><button id="mo">🗺️ OPENSTREETMAP</button></div><iframe class="municipalFrame" src="https://www.openstreetmap.org/export/embed.html?bbox=-48.15%2C-16.25%2C-47.75%2C-15.80&layer=mapnik" loading="lazy"></iframe>');E('mg').onclick=function(){external('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Valparaíso de Goiás, GO'))};E('mo').onclick=function(){external('https://www.openstreetmap.org/#map=12/-16.065/-47.975')}}function hist(){var h=data.history||[];modal('🕘 HISTÓRICO',h.length?h.map(function(o){return'<div class="pkg"><b>'+esc(o.name)+'</b><div class="small">'+esc(o.phone)+' • '+esc(o.address)+'</div></div>'}).join(''):'<p>Nenhum histórico.</p>')}function bind(){E('start').onclick=start;E('go').onclick=function(){var o=next();if(o)navPkg(o.id);else toast('Nenhuma entrega pendente.')};E('arrive').onclick=function(){var o=next();if(o){o.arrivedAt=new Date().toISOString();save();toast('📍 CHEGUEI registrado')}};E('deliver').onclick=function(){var o=next();if(o)donePkg(o.id)};E('finish').onclick=function(){data.history=data.history.concat(data.orders);data.orders=[];save();render();toast('✓ Rota finalizada')};E('manual').onclick=add;E('mapBtn').onclick=function(){if(pos)external('https://www.google.com/maps/@?api=1&map_action=map&center='+pos.lat+','+pos.lng+'&zoom=17&basemap=roadmap');else toast('GPS ainda não disponível')};E('sat').onclick=function(){if(pos)external('https://www.google.com/maps/@?api=1&map_action=map&center='+pos.lat+','+pos.lng+'&zoom=18&basemap=satellite');else toast('GPS ainda não disponível')};E('municipal').onclick=municipal;E('history').onclick=hist;E('search').onclick=function(){var o=next();if(o)searchPkg(o.id)};E('gas').onclick=function(){external('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('postos de combustíveis Valparaíso de Goiás'))};E('reload').onclick=gps;E('openGoogle').onclick=function(){if(pos)external('https://www.google.com/maps/@?api=1&map_action=map&center='+pos.lat+','+pos.lng+'&zoom=17');else external(searchUrl(next()))};E('photo').onclick=function(){E('camera').click()};E('paste').onclick=function(){var o=next();if(o)pastePkg(o.id)};E('close').onclick=close;E('modal').onclick=function(e){if(e.target===E('modal'))close()};E('camera').onchange=function(){if(E('camera').files.length)toast('✓ Foto recebida')};E('file').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){String(r.result).split(/\r?\n/).filter(Boolean).forEach(function(l){var a=l.split(/[;,]/);data.orders.push({id:String(Date.now())+Math.random(),name:a[0]||'Cliente',address:a[1]||'',number:a[2]||'',phone:a[3]||'',status:'pending'})});save();render();toast('✓ Importado')};r.readAsText(f)};E('import').onclick=function(){E('file').click()}}bind();render();gps();})();</script></body></html>
