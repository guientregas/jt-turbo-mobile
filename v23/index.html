<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>J&T Turbo V23</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172033;font:14px Arial,sans-serif}.top{background:#087cff;color:#fff;padding:14px}.wrap{max-width:1050px;margin:auto;padding:10px}.brand{font-size:23px;font-weight:900}.gps{float:right;font-size:11px}.card{background:#fff;border:1px solid #dfe6ef;border-radius:14px;margin:10px 0;padding:12px}.title{font-weight:900;margin-bottom:7px}.grid{display:grid;grid-template-columns:330px 1fr;gap:10px}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}button{border:0;border-radius:10px;background:#087cff;color:white;font-weight:800;padding:12px;min-height:45px;cursor:pointer}button:active{transform:scale(.98)}button.green{background:#0a9b67}button.red{background:#d84e5d}button.gold{background:#b97800}.counts{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin:10px -12px -12px;border-top:1px solid #e4e9ef}.counts div{padding:8px;border-right:1px solid #e4e9ef}.counts b{display:block;font-size:22px}.map{height:430px;width:100%;border:0;border-radius:10px;overflow:hidden;background:#dfe8ef}.map iframe{width:100%;height:100%;border:0}.pkg{border-top:1px solid #e4e9ef;padding:12px 0}.pkg:first-child{border-top:0}.small{font-size:11px;color:#68778b;line-height:1.5}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.actions button{font-size:10px;padding:9px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:flex-end}.modal.on{display:flex}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}.field{width:100%;padding:12px;margin:5px 0;border:1px solid #dbe3ed;border-radius:9px}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#172033;color:white;padding:11px 14px;border-radius:10px;display:none;z-index:20}.toast.on{display:block}.municipalFrame{height:70vh;width:100%;border:0;border-radius:12px;background:#eee}@media(max-width:760px){.grid{grid-template-columns:1fr}.map{height:360px}.actions{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><span class="brand">🚚 J&T TURBO</span><span id="gps" class="gps">📍 GPS</span></div></header>
<main class="wrap">
<button id="start" style="width:100%;font-size:16px;margin-bottom:10px">▶ COMEÇAR ROTA</button>
<section class="card"><div class="title">Entregas de hoje</div><div id="summary" class="small">Nenhuma entrega.</div><div class="counts"><div><b id="pending">0</b>PENDENTES</div><div><b id="done">0</b>ENTREGUES</div><div><b id="failed">0</b>NÃO ENTREGUES</div></div></section>
<section class="card"><div class="title">PRÓXIMA ENTREGA</div><div id="nextName">Nenhum pacote</div><div id="nextAddr" class="small">Cadastre uma entrega.</div><div class="actions"><button id="go">🧭 IR</button><button id="arrive">📍 CHEGUEI</button><button id="deliver" class="green">✓ ENTREGUE</button></div><button id="finish" class="gold" style="width:100%;margin-top:7px">✓ FINALIZAR ROTA</button></section>
<div class="grid"><div>
<section class="card"><div class="title">Adicionar</div><div class="small">Nome + WhatsApp obrigatórios. Endereço opcional.</div><div class="buttons" style="margin-top:8px"><button id="manual">＋ MANUAL</button><button id="import">📥 IMPORTAR</button><button id="photo">📷 FOTO</button><button id="paste">📍 COLAR WHATS</button></div></section>
<section class="card"><div class="title">Ferramentas</div><div class="buttons"><button id="gas">⛽ POSTOS</button><button id="mapBtn">🗺️ MAPA</button><button id="municipal">🏛️ MUNICIPAL</button><button id="history">🕘 HISTÓRICO</button><button id="search">🔎 BUSCAR</button><button id="sat">🛰️ SATÉLITE</button></div></section>
</div><div>
<section class="card"><div class="title">📦 Pacotes <span id="total" class="small"></span></div><div id="list"></div></section>
<section class="card"><div class="title">🗺️ Valparaíso de Goiás</div><div class="map"><iframe id="map" title="Mapa de Valparaíso de Goiás" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div class="buttons" style="margin-top:8px"><button id="reload">🔄 RECARREGAR</button><button id="openGoogle">🌐 GOOGLE MAPS</button></div></section>
</div></div></main>
<input id="file" type="file" accept=".csv,.txt,.json" hidden><input id="camera" type="file" accept="image/*" capture="environment" hidden>
<div id="modal" class="modal"><div class="sheet"><h3 id="modalTitle"></h3><div id="modalBody"></div><button id="close" style="width:100%;margin-top:8px">FECHAR</button></div></div><div id="toast" class="toast"></div>
<script>
var KEY="jtTurboV23";var data=loadData();var selected=null;var MAP_BBOX="-48.00%2C-16.10%2C-47.90%2C-15.98";var MAP_CENTER="-16.065,-47.975";
function el(id){return document.getElementById(id)}
function loadData(){try{var x=JSON.parse(localStorage.getItem(KEY)||"{}");return {orders:Array.isArray(x.orders)?x.orders:[],history:Array.isArray(x.history)?x.history:[]}}catch(e){return {orders:[],history:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function showToast(t){el("toast").textContent=t;el("toast").className="toast on";clearTimeout(window.__toast);window.__toast=setTimeout(function(){el("toast").className="toast"},2500)}
function openModal(t,b){el("modalTitle").textContent=t;el("modalBody").innerHTML=b;el("modal").className="modal on"}
function closeModal(){el("modal").className="modal"}
function pending(){return data.orders.filter(function(o){return o.status!=="done"&&o.status!=="failed"})}
function next(){return pending()[0]||null}
function cleanPhone(p){var n=String(p||"").replace(/\D/g,"");if(n.length===10||n.length===11)n="55"+n;return n}
function mapSearchUrl(o){var q=o&&o.address?[o.address,o.number,o.sector,"Valparaíso de Goiás","GO","Brasil"].filter(Boolean).join(", "):"Valparaíso de Goiás, GO, Brasil";return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q)}
function mapLink(o,sat){var lat=Number(o&&o.lat),lng=Number(o&&o.lng);if(!isFinite(lat)||!isFinite(lng))return mapSearchUrl(o);return "https://www.google.com/maps/@?api=1&map_action=map&center="+encodeURIComponent(lat+","+lng)+"&zoom=19&basemap="+(sat?"satellite":"roadmap")}
function navigation(o){if(!o)return showToast("Nenhuma entrega pendente.");if(!isFinite(Number(o.lat))||!isFinite(Number(o.lng)))return window.open(mapSearchUrl(o),"_blank");window.open("https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(o.lat+","+o.lng)+"&travelmode=driving&dir_action=navigate","_blank")}
function setMainMap(lat,lng,zoom){var z=zoom||13;el("map").src="https://www.openstreetmap.org/export/embed.html?bbox="+MAP_BBOX+"&layer=mapnik&marker="+encodeURIComponent(lat+","+lng)+"#map="+z+"/"+lat+"/"+lng}
function openMap(){var o=next();window.open(mapLink(o,false),"_blank")}
function satellite(){var o=next();window.open(mapLink(o,true),"_blank")}
function reloadMap(){setMainMap(-16.065,-47.975,13);showToast("✓ Mapa recarregado")}
function municipal(){openModal("🏛️ MAPA MUNICIPAL DE VALPARAÍSO",'<div class="small" style="margin-bottom:8px">O mapa municipal agora abre em uma página externa confiável, evitando iframe bloqueado. Você também pode abrir o mapa interativo abaixo.</div><div class="buttons"><button id="muniGoogle">🌐 GOOGLE MAPS</button><button id="muniOsm">🗺️ OPENSTREETMAP</button></div><div style="margin-top:10px"><iframe class="municipalFrame" src="https://www.openstreetmap.org/export/embed.html?bbox=-48.10%2C-16.20%2C-47.80%2C-15.85&layer=mapnik&marker=-16.065%2C-47.975" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" title="Mapa municipal"></iframe></div>');el("muniGoogle").onclick=function(){window.open("https://www.google.com/maps/search/?api=1&query=Prefeitura+Municipal+de+Valparaiso+de+Goias","_blank")};el("muniOsm").onclick=function(){window.open("https://www.openstreetmap.org/#map=12/-16.065/-47.975","_blank")}}
function render(){var p=pending(),n=next();el("pending").textContent=p.length;el("done").textContent=data.orders.filter(function(o){return o.status==="done"}).length;el("failed").textContent=data.orders.filter(function(o){return o.status==="failed"}).length;el("summary").textContent=p.length?p.length+" entrega(s) pendente(s)":"Nenhuma entrega.";el("nextName").textContent=n?n.name:"Nenhum pacote";el("nextAddr").textContent=n?[n.address,n.number,n.sector,"Valparaíso de Goiás","GO"].filter(Boolean).join(", "):"Cadastre uma entrega.";el("total").textContent=data.orders.length+" total";el("list").innerHTML=data.orders.length?data.orders.map(function(o){var has=isFinite(Number(o.lat))&&isFinite(Number(o.lng));return '<div class="pkg"><b>'+esc(o.name)+'</b><div class="small">📱 '+esc(o.phone)+'</div><div class="small">📍 '+esc([o.address,o.number,o.sector].filter(Boolean).join(", ")||"Sem endereço")+'</div><div class="small">'+(has?"✓ ponto confirmado":"⚠ ponto não confirmado")+'</div><div class="actions"><button onclick="editPkg(\''+o.id+'\')">✏️ EDITAR</button><button onclick="whats(\''+o.id+'\')">💬 WHATS</button><button onclick="pastePkg(\''+o.id+'\')">📍 COLAR</button><button onclick="searchPkg(\''+o.id+'\')">🔎 BUSCAR</button><button onclick="pinPkg(\''+o.id+'\')">📌 FIXAR</button><button onclick="navigation(getPkg(\''+o.id+'\'))">🧭 IR</button><button class="green" onclick="finishPkg(\''+o.id+'\')">✓ ENTREGUE</button><button class="red" onclick="failPkg(\''+o.id+'\')">✕ NÃO</button></div></div>"}).join(""):'<div class="small" style="padding:20px;text-align:center">Nenhuma entrega cadastrada.</div>'}
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function getPkg(id){return data.orders.find(function(o){return String(o.id)===String(id)})}
function editPkg(id){var o=getPkg(id);if(!o)return;selected=o;form(true)}
function form(edit){var o=selected;openModal(edit?"✏️ EDITAR ENTREGA":"＋ NOVA ENTREGA",'<input id="fn" class="field" placeholder="Nome *" value="'+esc(o&&o.name||"")+'"><input id="fp" class="field" placeholder="WhatsApp *" value="'+esc(o&&o.phone||"")+'"><input id="fa" class="field" placeholder="Rua / avenida / beco" value="'+esc(o&&o.address||"")+'"><input id="fnum" class="field" placeholder="Número / lote" value="'+esc(o&&o.number||"")+'"><input id="fsec" class="field" placeholder="Bairro / setor / quadra" value="'+esc(o&&o.sector||"")+'"><div class="buttons"><button id="savePkg">SALVAR</button><button id="pinForm">📌 FIXAR</button></div>');el("savePkg").onclick=function(){var n=el("fn").value.trim(),p=el("fp").value.trim();if(!n||!p)return showToast("Nome e WhatsApp são obrigatórios.");var x=edit?o:{id:String(Date.now())+Math.random().toString(16).slice(2),status:"pending"};x.name=n;x.phone=p;x.address=el("fa").value.trim();x.number=el("fnum").value.trim();x.sector=el("fsec").value.trim();if(edit){delete x.lat;delete x.lng}else data.orders.push(x);save();closeModal();render()};el("pinForm").onclick=function(){var x=o;if(!x){x={id:String(Date.now()),name:el("fn").value.trim(),phone:el("fp").value.trim(),address:el("fa").value.trim(),number:el("fnum").value.trim(),sector:el("fsec").value.trim(),status:"pending"};if(!x.name||!x.phone)return showToast("Preencha nome e WhatsApp.");data.orders.push(x);selected=x;save();render()}closeModal();pinPkg(x.id)}}
function whats(id){var o=getPkg(id);if(!o)return;var msg="Olá, "+o.name+"! 👋 Sou da J&T Turbo. Toque no 📎 → Localização → Enviar sua localização atual. Assim consigo chegar certinho.";window.open("https://wa.me/"+cleanPhone(o.phone)+"?text="+encodeURIComponent(msg),"_blank")}
function pastePkg(id){var o=getPkg(id);if(!o)return;var t=prompt("Cole aqui o link da localização enviado pelo WhatsApp:");if(!t)return;var m=t.match(/(-?\d{1,3}\.\d{4,})\s*[,; ]\s*(-?\d{1,3}\.\d{4,})/);if(!m){var q=t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);m=q}if(!m)return showToast("Não encontrei coordenadas nesse link.");o.lat=Number(m[1]);o.lng=Number(m[2]);o.fixed=true;save();render();showToast("✓ Localização salva")}
function pinPkg(id){var o=getPkg(id);if(!o)return;var q=prompt("Cole latitude,longitude do ponto exato:");if(!q)return;var m=q.trim().replace("; ",",").match(/^(-?\d+(?:\.\d+)?)[, ]+(-?\d+(?:\.\d+)?)$/);if(!m)return showToast("Formato: -16.123456,-47.123456");o.lat=Number(m[1]);o.lng=Number(m[2]);o.fixed=true;save();render();showToast("✓ Ponto exato salvo")}
function searchPkg(id){var o=getPkg(id);if(!o)return;window.open(mapSearchUrl(o),"_blank")}
function finishPkg(id){var o=getPkg(id);if(o){o.status="done";data.history=data.history.concat([o]);save();render();showToast("✓ Entrega concluída")}}
function failPkg(id){var o=getPkg(id);if(o){o.status="failed";data.history=data.history.concat([o]);save();render();showToast("Não entregue registrado")}}
function addManual(){selected=null;form(false)}
function importData(){el("file").click()}
el("file").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var txt=String(r.result);if(f.name.toLowerCase().endsWith(".json")){var j=JSON.parse(txt);var arr=Array.isArray(j)?j:(j.orders||[]);arr.forEach(function(a){data.orders.push({id:String(Date.now())+Math.random(),name:a.name||a.nome||"Cliente",address:a.address||a.endereco||"",number:a.number||a.numero||"",sector:a.sector||a.bairro||"",phone:a.phone||a.whatsapp||a.telefone||"",status:"pending"})})}else txt.split(/\r?\n/).filter(Boolean).forEach(function(line){var a=line.split(/[;,]/);data.orders.push({id:String(Date.now())+Math.random(),name:a[0]||"Cliente",address:a[1]||"",number:a[2]||"",phone:a[3]||"",status:"pending"})});save();render();showToast("✓ Importado")}catch(e){showToast("Erro ao importar arquivo")}};r.readAsText(f)}
function photo(){el("camera").click()}
function pasteAll(){var p=pending();if(!p.length)return showToast("Nenhuma entrega pendente.");var id=prompt("Digite o nome EXATO do cliente para associar a localização:");var o=p.find(function(x){return x.name.toLowerCase()===String(id||"").toLowerCase()});if(!o)return showToast("Cliente não encontrado.");pastePkg(o.id)}
function gas(){window.open("https://www.google.com/maps/search/?api=1&query=postos+de+combustiveis+Valparaiso+de+Goias","_blank")}
function showHistory(){var h=data.history||[];openModal("🕘 HISTÓRICO",(h.length?h.map(function(o){return '<div class="pkg"><b>'+esc(o.name)+'</b><div class="small">'+esc(o.phone)+" • "+esc(o.address||"")+'</div></div>'}).join(""):"<p>Nenhum histórico.</p>")+'<button id="clearHistory" class="red" style="width:100%">APAGAR HISTÓRICO</button>');el("clearHistory").onclick=function(){data.history=[];save();closeModal();showToast("Histórico apagado")}}
function finishRoute(){if(!data.orders.length)return showToast("Não há entregas.");data.history=data.history.concat(data.orders);data.orders=[];save();render();showToast("✓ Rota finalizada")}
function startRoute(){var p=pending();if(!p.length)return showToast("Cadastre entregas primeiro.");var missing=p.filter(function(o){return !isFinite(Number(o.lat))||!isFinite(Number(o.lng))});if(missing.length)return showToast("Há entregas sem ponto. Use BUSCAR, COLAR ou FIXAR.");navigation(p[0])}
function locateCurrent(){var o=next();if(o)searchPkg(o.id);else showToast("Cadastre uma entrega.")}
function locateGPS(){if(!navigator.geolocation)return showToast("GPS não disponível neste navegador.");navigator.geolocation.getCurrentPosition(function(pos){var lat=pos.coords.latitude,lng=pos.coords.longitude;el("gps").textContent="📍 "+lat.toFixed(5)+", "+lng.toFixed(5);setMainMap(lat,lng,15)},function(){showToast("Permita o acesso à localização para usar o GPS.")},{enableHighAccuracy:true,timeout:10000,maximumAge:30000})}
el("start").onclick=startRoute;el("go").onclick=function(){navigation(next())};el("arrive").onclick=function(){var o=next();if(o){o.arrivedAt=new Date().toISOString();save();showToast("📍 CHEGUEI registrado")}};el("deliver").onclick=function(){var o=next();if(o)finishPkg(o.id)};el("finish").onclick=finishRoute;el("manual").onclick=addManual;el("import").onclick=importData;el("photo").onclick=photo;el("paste").onclick=pasteAll;el("gas").onclick=gas;el("mapBtn").onclick=openMap;el("municipal").onclick=municipal;el("history").onclick=showHistory;el("search").onclick=locateCurrent;el("sat").onclick=satellite;el("reload").onclick=reloadMap;el("openGoogle").onclick=openMap;el("close").onclick=closeModal;el("camera").onchange=function(){if(el("camera").files.length)showToast("✓ Foto recebida. Use a edição manual para conferir os dados.")};el("modal").onclick=function(e){if(e.target===el("modal"))closeModal()};
setMainMap(-16.065,-47.975,13);locateGPS();render();
</script>
</body>
</html>
