</style></head><body><header class="top"><div class="wrap"><span class="brand">🚚 J&T e iMile</span></div></header><main class="wrap"><section class="box"><h1 style="margin:0">Painel de entregas</h1><div id="city" class="city"></div><div class="stats"><div class="stat"><b id="total">0</b>ENTREGAS</div><div class="stat"><b id="pending">0</b>PENDENTES</div><div class="stat"><b id="failed">0</b>NÃO ENTREGUES</div></div></section><section class="box"><div class="buttons"><button class="btn" id="scan">📷 SCANEAR</button><button class="btn light" id="write">✍️ ESCREVER PACOTE</button><button class="btn light" id="fileBtn">📁 ARQUIVO DA ROTA</button><button class="btn light" id="wa">📍 COLAR LOCALIZAÇÃO WHATSAPP</button><button class="btn dark" id="start">▶ COMEÇAR ROTA</button><button class="btn gold" id="history">🕘 HISTÓRICO</button></div></section><section id="routeBox" class="box hidden"><div class="route"><b>🚚 ROTA EM ANDAMENTO</b><div id="routeCount"></div><div id="routeName" style="font-size:22px;font-weight:900;margin-top:9px"></div><div id="routeAddr" class="muted"></div><div id="gps" style="margin-top:8px">📍 GPS aguardando permissão...</div><div class="route-kpis"><div class="route-kpi"><b id="routeKm">--</b><span>distância</span></div><div class="route-kpi"><b id="routeEta">--</b><span>tempo</span></div><div class="route-kpi"><b id="routeStatus">PENDENTE</b><span>status</span></div></div><div class="route-actions"><button class="btn dark" id="go">🧭 GPS</button><button class="btn light" id="ask">💬 PEDIR LOCALIZAÇÃO</button><button class="btn" id="arrived">📍 JÁ CHEGUEI</button><button class="btn dark" id="call">📞 LIGAR</button><button class="btn light" id="photoRoute">📷 FOTO</button><button class="btn green" id="deliver">✓ ENTREGUE</button><button class="btn red" id="failBtn">✕ NÃO ENTREGUE</button><button class="btn" id="editRoute">✏️ EDITAR</button><button class="btn gold wide" id="finish" style="font-size:16px;min-height:54px;position:sticky;bottom:6px;z-index:5">🏁
