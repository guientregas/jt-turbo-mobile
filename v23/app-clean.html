<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087cff"><title>J&T e iMile</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font:15px system-ui}.top{background:#087cff;color:#fff;padding:16px;position:sticky;top:0}.wrap{max-width:900px;margin:auto;padding:12px}.brand{font-size:23px;font-weight:900}.box{background:#fff;border-radius:18px;padding:14px;margin:12px 0}.muted{color:#68778b;font-size:13px}.city{background:#eef6ff;border:1px solid #cfe2ff;border-radius:12px;padding:10px;margin-top:10px;font-weight:800}.stats,.buttons,.two{display:grid;gap:7px}.stats{grid-template-columns:repeat(3,1fr);margin-top:9px}.stat{text-align:center;background:#f5f7fa;border-radius:11px;padding:8px}.stat b{display:block;font-size:23px}.buttons{grid-template-columns:1fr 1fr}.btn{border:0;border-radius:12px;padding:13px;background:#087cff;color:#fff;font-weight:850;min-height:48px}.green{background:#0a9b67}.red{background:#d84e5d}.dark{background:#172033}.light{background:#eef6ff;color:#075dbd}.gold{background:#b97800}.pkg{border:1px solid #e0e7ef;border-radius:14px;padding:12px;margin:8px 0}.head{display:flex;justify-content:space-between;gap:8px}.name{font-weight:900;font-size:17px}.badge{font-size:10px;font-weight:900;padding:4px 7px;border-radius:99px;background:#eef6ff;color:#075dbd;height:max-content}.done{background:#e8f8f1;color:#087653}.fail{background:#fff0f2;color:#a52e40}.field{width:100%;padding:12px;border:1px solid #d7e0ea;border-radius:11px;margin:4px 0;font:inherit}.two{grid-template-columns:1fr 1fr}.map{height:390px;border-radius:14px;overflow:hidden}.route{background:#172033;color:#fff;border-radius:18px;padding:15px}.route .muted{color:#cbd8e8}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.modal.on{display:flex}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}.toast{display:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:12px 16px;border-radius:12px;z-index:40}.toast.on{display:block}.hidden{display:none!important}.hist{border:1px solid #e0e7ef;border-radius:12px;padding:10px;margin:7px 0}@media(max-width:600px){.two{grid-template-columns:1fr}}
</style><style>
#map{position:relative!important;z-index:1!important;isolation:isolate}
#map .leaflet-control{z-index:400!important}
.box{position:relative;z-index:2}

</style></head><body><header class="top"><div class="wrap"><span class="brand">🚚 J&T e iMile</span></div></header><main class="wrap"><section class="box"><h1 style="margin:0">Painel de entregas</h1><div class="muted">Coleta → rota → entrega → histórico</div><div id="city" class="city"></div><div class="stats"><div class="stat"><b id="total">0</b>ENTREGAS</div><div class="stat"><b id="pending">0</b>PENDENTES</div><div class="stat"><b id="failed">0</b>NÃO ENTREGUES</div></div></section><section class="box"><div class="buttons"><button class="btn" id="scan">📷 SCANEAR</button><button class="btn light" id="write">✍️ ESCREVER PACOTE</button><button class="btn light" id="fileBtn">📁 ARQUIVO DA ROTA</button><button class="btn light" id="wa">📍 COLAR LOCALIZAÇÃO WHATSAPP</button><button class="btn dark" id="start">▶ COMEÇAR ROTA</button><button class="btn gold" id="history">🕘 HISTÓRICO</button></div></section><section id="routeBox" class="box hidden"><div class="route"><b>🚚 ROTA EM ANDAMENTO</b><div id="routeCount"></div><div id="routeName" style="font-size:22px;font-weight:900;margin-top:9px"></div><div id="routeAddr" class="muted"></div><div id="gps" style="margin-top:8px">📍 GPS...</div><div class="buttons" style="margin-top:9px"><button class="btn" id="go">🧭 IR</button><button class="btn light" id="ask">💬 PEDIR LOCALIZAÇÃO</button><button class="btn green" id="deliver">✓ ENTREGUE</button><button class="btn red" id="failBtn">✕ NÃO ENTREGUE</button><button class="btn" id="editRoute">✏️ EDITAR</button><button class="btn gold" id="finish" style="grid-column:1/-1;font-size:16px;min-height:54px">🏁 ENCERRAR ROTA E SALVAR NO HISTÓRICO</button></div></div></section><section class="box"><h2 style="font-size:17px">📦 Pacotes</h2><div id="list"></div></section><section class="box"><h2 style="font-size:17px">🗺️ Mapa da rota</h2><div class="muted">Pins numerados.</div><div id="map" class="map" style="margin-top:8px"></div><button class="btn dark" id="street" style="width:100%;margin-top:8px">🏠 STREET VIEW / MAPS</button></section></main><input id="file" type="file" accept=".csv,.txt,.json,.pdf" hidden><div id="modal" class="modal"><div class="sheet"><h2 id="mt"></h2><div id="mb"></div><button class="btn dark" id="close" style="width:100%;margin-top:8px">FECHAR</button></div></div><div id="toast" class="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(function(){
let me=null,accCircle=null;
function ensureMapSize(){if(window.map){setTimeout(()=>window.map.invalidateSize({animate:false}),100)}}
window.addEventListener('resize',ensureMapSize);
document.addEventListener('visibilitychange',ensureMapSize);
const oldInit=window.initMap;
window.jtStartLiveGPS=function(){
 if(!navigator.geolocation){document.getElementById('gps').textContent='⚠️ GPS indisponível';return}
 navigator.geolocation.watchPosition(function(p){
   const lat=p.coords.latitude,lng=p.coords.longitude,acc=p.coords.accuracy||0;
   const pos=[lat,lng];
   if(window.map){
     if(!me) me=L.marker(pos,{icon:L.divIcon({className:'',html:'<div class="gps-me"></div>',iconSize:[20,20],iconAnchor:[10,10]})}).addTo(window.map).bindPopup('<b>📍 Você está aqui</b>');
     else me.setLatLng(pos);
     if(accCircle){accCircle.setLatLng(pos).setRadius(acc)}
     else accCircle=L.circle(pos,{radius:acc,weight:1,fillOpacity:.06}).addTo(window.map);
   }
   const el=document.getElementById('gps');
   if(el) el.textContent='📍 GPS ativo • precisão '+Math.round(acc)+' m';
 },function(){
   const el=document.getElementById('gps'); if(el) el.textContent='⚠️ Autorize a localização para acompanhar o GPS';
 },{enableHighAccuracy:true,maximumAge:1000,timeout:15000});
};
const oldDraw=window.draw;
window.jtFitRoute=function(){
 if(!window.map)return;
 const pts=[];
 if(me)pts.push(me.getLatLng());
 if(window.marks)window.marks.forEach(m=>pts.push(m.getLatLng()));
 if(pts.length)window.map.fitBounds(L.latLngBounds(pts).pad(.15),{maxZoom:16});
 ensureMapSize();
};
setTimeout(function(){
 ensureMapSize();
 if(window.initMap){try{window.initMap()}catch(e){}}
 window.jtStartLiveGPS();
},300);
})();
</script><script>(function(){'use strict';const KEY='jtTurboClean',OLD='jtTurboV23';let D=load(),map,marks=[],route=[],i=0,on=false,watch;const $=x=>document.getElementById(x);function load(){try{let d=JSON.parse(localStorage.getItem(KEY)||'{}');if(d.orders)return d;let o=JSON.parse(localStorage.getItem(OLD)||'{}');return{orders:o.orders||[],history:o.history||[],city:''}}catch(e){return{orders:[],history:[],city:''}}}function save(){localStorage.setItem(KEY,JSON.stringify(D))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){$('toast').textContent=s;$('toast').className='toast on';setTimeout(()=>$('toast').className='toast',2200)}function modal(t,b){$('mt').textContent=t;$('mb').innerHTML=b;$('modal').className='modal on'}function close(){$('modal').className='modal'}function coord(s){let m=String(s||'').match(/(-?\d+(?:[.,]\d+)?)[\s,;]+(-?\d+(?:[.,]\d+)?)/);if(m){let a=+m[1].replace(',','.'),b=+m[2].replace(',','.');if(Math.abs(a)<=90&&Math.abs(b)<=180)return{lat:a,lng:b};if(Math.abs(a)<=180&&Math.abs(b)<=90)return{lat:b,lng:a}}let q=String(s||'').match(/@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/);return q?{lat:+q[1],lng:+q[2]}:null}function render(){let a=D.orders;$('total').textContent=a.length;$('pending').textContent=a.filter(x=>x.status==='pending').length;$('failed').textContent=a.filter(x=>x.status==='failed').length;$('city').textContent='🏙️ Município principal: '+(D.city||'defina ao iniciar a rota');$('list').innerHTML=a.length?a.map(o=>`<div class="pkg"><div class="head"><div><div class="name">${esc(o.name)}</div><div class="muted">📦 ${o.qty||1} pacote(s) • ${esc(o.address)}</div><div class="muted">${esc(o.number)} • ${esc(o.sector)} • ${esc(o.city||D.city)}</div></div><span class="badge ${o.status==='done'?'done':o.status==='failed'?'fail':''}">${o.status==='done'?'ENTREGUE':o.status==='failed'?'NÃO ENTREGUE':'PENDENTE'}</span></div><div class="buttons" style="margin-top:8px"><button class="btn light" onclick="edit('${o.id}')">✏️ EDITAR</button><button class="btn light" onclick="del('${o.id}')">🗑️ EXCLUIR</button><button class="btn" onclick="goPkg('${o.id}')">🧭 IR</button></div></div>`).join(''):'<div class="muted" style="text-align:center;padding:22px">Nenhum pacote.</div>';draw()}function initMap(){map=L.map('map').setView([-15.87,-48.05],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}function draw(){marks.forEach(x=>x.remove());marks=[];let a=D.orders.filter(x=>x.lat&&x.lng);a.forEach((o,n)=>{let ic=L.divIcon({className:'',html:'<div style="background:#087cff;color:white;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:900;border:2px solid white">'+(n+1)+'</div>',iconSize:[30,30],iconAnchor:[15,15]});marks.push(L.marker([o.lat,o.lng],{icon:ic}).addTo(map).bindPopup('<b>'+(n+1)+'. '+esc(o.name)+'</b><br>'+esc(o.address)))});if(marks.length)map.fitBounds(L.featureGroup(marks).getBounds().pad(.18))}function form(o){o=o||{};modal(o.id?'✏️ EDITAR PACOTE':'✍️ ESCREVER PACOTE',`<input id="n" class="field" placeholder="Nome da pessoa" value="${esc(o.name)}"><input id="p" class="field" placeholder="Celular / WhatsApp" value="${esc(o.phone)}"><input id="a" class="field" placeholder="Endereço" value="${esc(o.address)}"><div class="two"><input id="nu" class="field" placeholder="Número / lote" value="${esc(o.number)}"><input id="se" class="field" placeholder="Bairro / quadra" value="${esc(o.sector)}"></div><div class="two"><input id="ci" class="field" placeholder="Cidade" value="${esc(o.city||D.city)}"><input id="q" class="field" type="number" min="1" value="${o.qty||1}" placeholder="Quantidade"></div><input id="co" class="field" placeholder="Latitude, longitude (opcional)" value="${o.lat&&o.lng?o.lat+', '+o.lng:''}"><button class="btn green" id="sv" style="width:100%">✓ SALVAR PACOTE</button>`);$('sv').onclick=()=>{let c=coord($('co').value),x=o.id?o:{id:Date.now()+''};if(!o.id)D.orders.push(x);Object.assign(x,{name:$('n').value.trim(),phone:$('p').value.trim(),address:$('a').value.trim(),number:$('nu').value.trim(),sector:$('se').value.trim(),city:$('ci').value.trim()||D.city,qty:+$('q').value||1,status:x.status||'pending'});if(c){x.lat=c.lat;x.lng=c.lng}if(!x.name&&!x.packageId)return toast('Informe o nome ou o código do pacote');if(!x.address&&!c)return toast('Informe o endereço ou a localização');if(!D.city&&x.city)D.city=x.city;save();close();render()}}window.edit=id=>{let o=D.orders.find(x=>x.id==id);if(o)form(o)};window.del=id=>{if(confirm('Excluir este pacote?')){D.orders=D.orders.filter(x=>x.id!=id);save();render()}};window.goPkg=id=>{let o=D.orders.find(x=>x.id==id);if(o)go(o)};function go(o){let q=o.lat&&o.lng?o.lat+','+o.lng:o.address+' '+(o.city||D.city);window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(q),'_blank')}function street(o){let q=o.lat&&o.lng?o.lat+','+o.lng:o.address+' '+(o.city||D.city);window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q),'_blank')}function ask(o){let p=(o.phone||'').replace(/\D/g,'');if(!p)return toast('Cadastre o celular');window.open('https://wa.me/'+(p.length===11?'55'+p:p)+'?text='+encodeURIComponent('Olá, '+o.name+'. Sou o entregador. Poderia me enviar sua localização atual pelo WhatsApp? 📍'),'_blank')}function waForm(){modal('📍 LOCALIZAÇÃO DO WHATSAPP','<div class="muted">Cole a latitude e longitude ou o link que a pessoa enviou pelo WhatsApp.</div><textarea id="wc" class="field" rows="3" placeholder="-15.873210, -48.045670 ou link do Google Maps"></textarea><button class="btn light" id="clip" style="width:100%">📋 COLAR O QUE A PESSOA MANDOU</button><div id="ws" class="city">🟡 Aguardando localização</div><input id="wn" class="field" placeholder="Nome da pessoa"><input id="wp" class="field" placeholder="Número de celular / WhatsApp"><input id="wa" class="field" placeholder="Endereço"><div class="two"><input id="wno" class="field" placeholder="Número / lote"><input id="wse" class="field" placeholder="Bairro / quadra"></div><input id="wci" class="field" placeholder="Cidade"><input id="wq" class="field" type="number" min="1" value="1" placeholder="Quantidade"><button class="btn green" id="wsv" style="width:100%">✓ SALVAR PACOTE</button>');let check=()=>{let c=coord($('wc').value);$('ws').innerHTML=c?'🟢 LOCALIZAÇÃO RECEBIDA<br><b>'+c.lat.toFixed(6)+', '+c.lng.toFixed(6)+'</b>':'🟡 Aguardando latitude/longitude'};$('wc').oninput=check;$('clip').onclick=async()=>{try{$('wc').value=await navigator.clipboard.readText();check()}catch(e){toast('Cole manualmente no campo')}};$('wsv').onclick=()=>{let c=coord($('wc').value),n=$('wn').value.trim(),p=$('wp').value.trim(),a=$('wa').value.trim();if(!c||!n||!p||!a)return toast('Preencha localização, nome, celular e endereço');D.orders.push({id:Date.now()+''+Math.random(),name:n,phone:p,address:a,number:$('wno').value.trim(),sector:$('wse').value.trim(),city:$('wci').value.trim()||D.city,qty:+$('wq').value||1,lat:c.lat,lng:c.lng,status:'pending',locationSource:'WhatsApp'});if(!D.city&&$('wci').value.trim())D.city=$('wci').value.trim();save();close();render()}}function start(){let p=D.orders.filter(x=>x.status==='pending');if(!p.length)return toast('Não há entregas pendentes');modal('🏙️ MUNICÍPIO PRINCIPAL','<div class="muted">Defina o município antes de começar.</div><input id="rc" class="field" placeholder="Ex.: Valparaíso de Goiás" value="'+esc(D.city)+'"><button class="btn green" id="rs" style="width:100%">▶ COMEÇAR ROTA</button>');$('rs').onclick=()=>{D.city=$('rc').value.trim();if(!D.city)return toast('Informe o município');save();close();route=D.orders.filter(x=>x.status==='pending');i=0;on=true;$('routeBox').className='box';showRoute();watch=navigator.geolocation?.watchPosition(p=>{$('gps').textContent='📍 GPS ativo • precisão '+Math.round(p.coords.accuracy||0)+' m'},()=>{$('gps').textContent='⚠️ GPS indisponível'},{enableHighAccuracy:true,maximumAge:1500,timeout:10000})}}function showRoute(){let o=route[i];if(!o)return finish();$('routeCount').textContent=(i+1)+' de '+route.length;$('routeName').textContent=o.name;$('routeAddr').textContent=(o.address||'')+' '+(o.number||'')+' • '+(o.sector||'')+' • '+(o.city||D.city);draw()}function mark(s){let o=route[i];if(!o)return;o.status=s;save();i++;render();showRoute()}function finish(){if(!on)return;let items=route.map(x=>({...x})),ids=new Set(items.map(x=>x.id));D.history.unshift({id:Date.now()+''+Math.random(),date:new Date().toISOString(),city:D.city,total:items.length,done:items.filter(x=>x.status==='done').length,failed:items.filter(x=>x.status==='failed').length,orders:items});D.orders=D.orders.filter(x=>!ids.has(x.id));save();on=false;route=[];i=0;$('routeBox').className='box hidden';if(watch)navigator.geolocation.clearWatch(watch);render();history();toast('✓ Rota encerrada e enviada ao histórico')}function history(){modal('🕘 HISTÓRICO',D.history.length?D.history.map(h=>`<div class="hist"><b>${new Date(h.date).toLocaleString('pt-BR')}</b><br>🏙️ ${esc(h.city)}<br>📦 ${h.total} • ✓ ${h.done} entregues • ✕ ${h.failed} não entregues<button class="btn light" style="width:100%;margin-top:7px" onclick="detail('${h.id}')">VER PACOTES</button></div>`).join(''):'<div class="muted">Nenhuma rota encerrada.</div>')}window.detail=id=>{let h=D.history.find(x=>x.id==id);if(h)modal('📦 PACOTES DA ROTA',h.orders.map(o=>`<div class="hist"><b>${esc(o.name)}</b><br>📦 ${o.qty||1} • ${esc(o.address)} ${esc(o.number)}<br>${esc(o.sector)} • ${esc(o.city||h.city)}<br>${o.status==='done'?'✓ ENTREGUE':'✕ NÃO ENTREGUE'}</div>`).join(''))};async function imp(e){let f=e.target.files[0];if(!f)return;let t=await f.text();try{let a=JSON.parse(t);if(!Array.isArray(a))a=a.orders||[];add(a)}catch(_){let l=t.split(/\r?\n/).filter(Boolean),h=l.shift().split(/[;,\t]/).map(x=>x.trim().toLowerCase());add(l.map(z=>{let v=z.split(/[;,\t]/),o={};h.forEach((k,j)=>o[k]=v[j]||'');return o}))}e.target.value=''}function add(a){a.forEach(x=>{let c=coord(x.coords||x.localizacao||((x.latitude||'')+' '+(x.longitude||''))),o={id:Date.now()+''+Math.random(),name:x.name||x.nome||x.cliente||'Cliente',phone:x.phone||x.telefone||'',address:x.address||x.endereco||x.rua||'',number:x.number||x.numero||x.lote||'',sector:x.sector||x.bairro||x.quadra||'',city:x.city||x.cidade||D.city,qty:+(x.qty||x.quantidade||1),status:'pending'};if(c){o.lat=c.lat;o.lng=c.lng}if(o.name||o.address||o.phone||o.lat||o.packageId)D.orders.push(o)});save();render();toast('Pacotes importados')}function scan(){modal('📷 SCANEAR','<video id="v" style="width:100%;border-radius:14px" autoplay playsinline></video><button class="btn light" id="stop" style="width:100%;margin-top:8px">PARAR</button>');navigator.mediaDevices?.getUserMedia({video:{facingMode:{ideal:'environment'}}}).then(s=>{let v=$('v');v.srcObject=s;if('BarcodeDetector'in window){let d=new BarcodeDetector({formats:['qr_code','code_128','code_39','ean_13','ean_8']});let active=1;(async function loop(){if(!active)return;try{let r=await d.detect(v);if(r.length){active=0;s.getTracks().forEach(t=>t.stop());let code=r[0].rawValue||'';let x={id:Date.now()+''+Math.random(),packageId:code,name:'Cliente',phone:'',address:'',number:code,sector:'',city:D.city,qty:1,status:'pending'};D.orders.push(x);save();close();render();form(x);toast('✓ Pacote escaneado e salvo');return}}catch(e){}requestAnimationFrame(loop)})()}else toast('Scanner automático não disponível; use Escrever Pacote');$('stop').onclick=()=>{s.getTracks().forEach(t=>t.stop());close()}}).catch(()=>toast('Autorize a câmera'))}function init(){initMap();$('close').onclick=close;$('scan').onclick=scan;$('write').onclick=()=>form();$('fileBtn').onclick=()=>$('file').click();$('file').onchange=imp;$('wa').onclick=waForm;$('start').onclick=start;$('history').onclick=history;$('go').onclick=()=>go(route[i]);$('ask').onclick=()=>ask(route[i]);$('deliver').onclick=()=>mark('done');$('failBtn').onclick=()=>mark('failed');$('editRoute').onclick=()=>form(route[i]);$('finish').onclick=finish;$('street').onclick=()=>route[i]&&street(route[i]);render()}function initMap(){map=L.map('map').setView([-15.87,-48.05],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}init()})();</script><script>
(function(){
function refreshPins(){
 try{
  if(typeof draw==='function') draw();
  if(window.map && typeof map.invalidateSize==='function') map.invalidateSize({animate:false});
 }catch(e){}
}
window.addEventListener('load',()=>setTimeout(refreshPins,500));
window.addEventListener('resize',()=>setTimeout(refreshPins,100));
document.addEventListener('visibilitychange',()=>setTimeout(refreshPins,200));
})();
</script></body></html>
