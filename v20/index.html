<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f9fc"><title>J&T Turbo</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#182235;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1050px;margin:auto;padding:12px}.top{background:#fff;border-bottom:1px solid #e3e8ef;padding:15px}.brand{font-size:25px;font-weight:950}.brand i{color:#287bea;font-style:normal}.gps{font-size:11px;color:#718096;margin-top:3px}.start{width:100%;height:58px;border:0;border-radius:16px;background:#287bea;color:white;font-size:17px;font-weight:950;margin-bottom:12px;box-shadow:0 8px 20px #287bea25}.card{background:#fff;border:1px solid #e1e7ef;border-radius:17px;margin-bottom:12px;box-shadow:0 5px 20px #26364b0b;overflow:hidden}.pad{padding:15px}.title{font-size:16px;font-weight:900}.sub{font-size:11px;color:#78869a;margin-top:3px}.counts{display:grid;grid-template-columns:repeat(3,1fr);margin:14px -15px -15px;border-top:1px solid #e6ebf1}.count{text-align:center;padding:12px;border-right:1px solid #e6ebf1}.count:last-child{border:0}.count b{font-size:25px;display:block}.count span{font-size:9px;font-weight:900;color:#748197}.blue b{color:#287bea}.green b{color:#159968}.red b{color:#d65460}.next{background:#fbfdff;border-color:#d9e7fb}.nextin{padding:16px}.nextlabel{font-size:9px;font-weight:950;color:#287bea;letter-spacing:1px}.nextname{font-size:20px;font-weight:950;margin-top:3px}.nextaddr{font-size:12px;color:#5f6c80;line-height:1.45}.dist{font-size:14px;color:#159968;font-weight:950}.nextrow{display:flex;justify-content:space-between;gap:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.btn{min-height:43px;border:1px solid #dce3eb;border-radius:11px;background:#fff;color:#182235;font:inherit;font-size:11px;font-weight:900;padding:8px 10px}.primary{background:#287bea;color:#fff;border-color:#287bea}.ok{background:#eaf8f2;color:#147d55;border-color:#c9e9da}.bad{background:#fff0f2;color:#b6404d;border-color:#ffd1d7}.warn{background:#fff5e5;color:#966319;border-color:#f0d7a6}.wa{background:#e9f8f0;color:#12804f;border-color:#c7e9d7}.loc{background:#edf5ff;color:#2169cf;border-color:#d3e5ff}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px}.tool{min-height:66px;border:1px solid #e0e6ed;background:#f9fbfd;border-radius:13px;font:inherit;font-weight:900;color:#1b2638}.tool strong{display:block;font-size:21px}.tool small{display:block;font-size:9px;color:#6e7c90;margin-top:4px}.head{padding:14px 15px;border-bottom:1px solid #e6ebf1}.grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:12px}.pkg{padding:14px 0;border-bottom:1px solid #e7ebf0}.pkg:last-child{border:0}.pkghead{display:flex;justify-content:space-between;gap:7px}.pkgname{font-size:14px;font-weight:950}.badge{font-size:8px;font-weight:950;background:#eef2f6;color:#66758a;border-radius:99px;padding:5px 8px}.badge.done{background:#e8f8f0;color:#137c53}.badge.fail{background:#fff0f2;color:#b6404d}.pkgaddr,.phone,.coords{font-size:10px;line-height:1.45;margin-top:4px;color:#647287}.phone{color:#718096}.coords{color:#18855a}.pkgactions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.pkgactions .btn{min-height:37px;font-size:9px}.mapbox{height:380px}.map{height:100%;width:100%}.maptools{position:absolute;right:10px;top:10px;z-index:500;display:flex;gap:6px}.mapwrap{height:380px;position:relative}.maptools button{width:40px;height:40px;border:1px solid #dce3eb;border-radius:11px;background:#fff}.modal{position:fixed;inset:0;background:#15223866;display:none;align-items:flex-end;z-index:5000}.modal.show{display:flex}.sheet{width:100%;max-height:90vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px}.sheettop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sheet h3{margin:0}.field{display:block;width:100%;padding:12px;border:1px solid #dce4ec;background:#f9fbfd;border-radius:10px;margin:6px 0;font:inherit}.note{padding:11px;background:#f5f8fc;border-radius:10px;font-size:10px;color:#68778b;line-height:1.5;margin:7px 0}.empty{text-align:center;color:#7b889a;font-size:11px;padding:25px}.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,15px);opacity:0;background:#172235;color:#fff;padding:11px 15px;border-radius:11px;font-size:11px;font-weight:850;z-index:6000;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.wrap{padding:8px}.grid{grid-template-columns:1fr}.tools{grid-template-columns:1fr 1fr}.mapwrap{height:310px}.nextname{font-size:18px}}
</style></head><body><header class="top"><div class="wrap"><div class="brand">🚚 J&T <i>TURBO</i></div><div id="gps" class="gps">📍 GPS não iniciado</div></div></header><main class="wrap"><button id="start" class="start">▶ COMEÇAR ROTA</button><section class="card"><div class="pad"><div class="title">Entregas do dia</div><div id="day" class="sub">Adicione seus pacotes para começar.</div><div class="counts"><div class="count blue"><b id="pending">0</b><span>PENDENTES</span></div><div class="count green"><b id="done">0</b><span>ENTREGUES</span></div><div class="count red"><b id="failed">0</b><span>NÃO ENTREGUES</span></div></div></div></section><section class="card next"><div class="nextin"><div class="nextlabel">PRÓXIMA ENTREGA</div><div class="nextrow"><div><div id="nextname" class="nextname">Nenhum pacote</div><div id="nextaddr" class="nextaddr">Adicione uma entrega.</div></div><div id="dist" class="dist">—</div></div><div class="actions"><button id="go" class="btn primary">🧭 IR</button><button id="arrive" class="btn">📍 CHEGUEI</button><button id="deliver" class="btn ok">✓ ENTREGUE</button><button id="finish" class="btn warn">✓ FINALIZAR ROTA</button></div></div></section><div class="grid"><div><section class="card"><div class="head"><div class="title">Adicionar pacotes</div><div class="sub">Sem complicação</div></div><div class="tools"><button id="manual" class="tool"><strong>＋</strong><small>MANUAL</small></button><button id="import" class="tool"><strong>📥</strong><small>IMPORTAR</small></button><button id="photo" class="tool"><strong>📷</strong><small>FOTO</small></button><button id="paste" class="tool"><strong>📋</strong><small>COLAR WHATS</small></button></div></section><section class="card"><div class="head"><div class="title">Atalhos</div></div><div class="tools"><button id="gas" class="tool"><strong>⛽</strong><small>POSTOS</small></button><button id="mapOpen" class="tool"><strong>🗺️</strong><small>ABRIR MAPA</small></button><button id="mun" class="tool"><strong>🏛️</strong><small>MAPA MUNICIPAL</small></button><button id="hist" class="tool"><strong>🕘</strong><small>HISTÓRICO</small></button></div></section></div><div><section class="card"><div class="head"><div class="title">📦 Pacotes</div><div id="listSub" class="sub">0 entregas</div></div><div id="list" class="pad"></div></section><section class="card"><div class="head"><div class="title">🗺️ Mapa</div><div class="sub">Pontos das entregas e sua posição.</div></div><div class="mapwrap"><div id="map" class="map"></div><div class="maptools"><button id="fit">⌖</button><button id="mapGps">📍</button></div></div></section></div></div></main><input id="file" type="file" accept=".csv,.txt,.json" hidden><input id="photoFile" type="file" accept="image/*" capture="environment" hidden><div id="modal" class="modal"><div class="sheet"><div class="sheettop"><h3 id="mt">J&T Turbo</h3><button id="close" class="btn">FECHAR</button></div><div id="mb"></div></div></div><div id="toast" class="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
'use strict';
const KEY='jtTurboV20',CENTER=[-16.0651,-47.9757];let S=load(),gps=null,map,markers,routeLine;
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'{}');return{orders:Array.isArray(x.orders)?x.orders:[],route:Array.isArray(x.route)?x.route:[],history:Array.isArray(x.history)?x.history:[],gps:x.gps||null}}catch(e){return{orders:[],route:[],history:[],gps:null}}}
function save(){S.gps=gps||S.gps||null;localStorage.setItem(KEY,JSON.stringify(S))}function $(id){return document.getElementById(id)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){let e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('on'),2400)}function modal(t,h){$('mt').textContent=t;$('mb').innerHTML=h;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}function active(){return S.orders.filter(o=>o.status!=='done'&&o.status!=='failed')}function addr(o){return[o.address,o.number,o.complement,o.sector,o.city||'Valparaíso de Goiás',o.state||'GO'].filter(Boolean).join(', ')}function dist(a,b){let R=6371000,p=Math.PI/180,d1=(b.lat-a.lat)*p,d2=(b.lng-a.lng)*p,x=Math.sin(d1/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(x))}function fmt(m){return m<1000?Math.round(m)+' m':(m/1000).toFixed(1)+' km'}
function initMap(){if(map)return;map=L.map('map').setView(CENTER,13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);markers=L.layerGroup().addTo(map);setTimeout(()=>map.invalidateSize(),300)}
function draw(){initMap();markers.clearLayers();if(routeLine){routeLine.remove();routeLine=null}let pts=[];S.orders.forEach((o,i)=>{if(o.lat==null||o.lng==null||o.status==='done'||o.status==='failed')return;let n=S.route.indexOf(o.id);n=n>=0?n+1:i+1;let ic=L.divIcon({className:'',html:'<div style="width:30px;height:30px;border-radius:50%;background:#287bea;color:white;border:3px solid white;display:grid;place-items:center;font-weight:900;box-shadow:0 2px 8px #0003">'+n+'</div>',iconSize:[30,30],iconAnchor:[15,15]});L.marker([o.lat,o.lng],{icon:ic}).bindPopup('<b>'+esc(o.name||'Cliente')+'</b><br>'+esc(addr(o))).addTo(markers);pts.push([o.lat,o.lng])});if(gps){L.circleMarker([gps.lat,gps.lng],{radius:7,color:'#159968',fillColor:'#159968',fillOpacity:.9}).bindTooltip('Você').addTo(markers);if(pts.length)pts.unshift([gps.lat,gps.lng])}if(pts.length>1)routeLine=L.polyline(pts,{color:'#287bea',weight:4,opacity:.6}).addTo(map)}
function getGPS(){return new Promise(res=>{if(!navigator.geolocation){toast('GPS não disponível neste navegador.');return res(null)}navigator.geolocation.getCurrentPosition(p=>{gps={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy};$('gps').textContent='📍 GPS ativo • ±'+Math.round(p.coords.accuracy||0)+' m';save();draw();res(gps)},()=>{toast('Permita a localização do navegador.');res(null)},{enableHighAccuracy:true,timeout:12000,maximumAge:3000})})}
async function geocode(o){if(o.lat!=null&&o.lng!=null)return true;try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q='+encodeURIComponent(addr(o)),{headers:{'Accept':'application/json'}}),a=await r.json();if(a[0]){o.lat=+a[0].lat;o.lng=+a[0].lon;return true}}catch(e){}return false}
function current(){let a=active();for(let id of S.route){let o=a.find(x=>x.id===id);if(o)return o}return a[0]}
async function startRoute(){let a=active();if(!a.length)return toast('Adicione pelo menos um pacote.');let g=await getGPS();if(!g)return;toast('Organizando a rota...');for(let o of a)await geocode(o);let left=a.filter(o=>o.lat!=null&&o.lng!=null),order=[],p=g;while(left.length){left.sort((x,y)=>dist(p,x)-dist(p,y));let n=left.shift();order.push(n.id);p={lat:n.lat,lng:n.lng}}S.route=order;save();render();draw();let n=current();if(n)go(n)}
function go(o=current()){if(!o)return toast('Nenhuma entrega pendente.');let d=o.lat!=null?o.lat+','+o.lng:encodeURIComponent(addr(o));window.open('https://www.google.com/maps/dir/?api=1&destination='+d+'&travelmode=driving','_blank')}
function waPhone(o){let p=String(o.phone||'').replace(/\D/g,'');if(p.length===10||p.length===11)p='55'+p;return p}function whats(o){return'Olá, '+(o.name||'tudo bem')+'! Sou da J&T Turbo e estou indo fazer sua entrega. Pode me enviar aqui pelo WhatsApp a sua localização/ponto fixo? Assim consigo chegar certinho até você. Obrigado!'}function callWa(o){if(!o)return;let p=waPhone(o),u=p?'https://wa.me/'+p+'?text='+encodeURIComponent(whats(o)):'https://wa.me/?text='+encodeURIComponent(whats(o));window.open(u,'_blank')}
function extract(text){let t=decodeURIComponent(String(text||'').replace(/\s+/g,' ')),patterns=[/(?:q=|query=|ll=|@)(-?\d{1,3}(?:\.\d+)?)[,\s]+(-?\d{1,3}(?:\.\d+)?)/i,/(?:geo:)(-?\d{1,3}(?:\.\d+)?),(-?\d{1,3}(?:\.\d+)?)/i,/(-?\d{1,3}\.\d{4,})\s*[,; ]\s*(-?\d{1,3}\.\d{4,})/];for(let p of patterns){let m=t.match(p);if(m){let lat=+m[1],lng=+m[2];if(Math.abs(lat)<=90&&Math.abs(lng)<=180)return{lat,lng}}}return null}
function pasteWhats(id){let opts=active().map(o=>'<option value="'+esc(o.id)+'">'+esc(o.name||'Cliente')+' — '+esc(o.phone||'sem WhatsApp')+'</option>').join('');modal('📋 Colar mapa enviado no WhatsApp','<div class="note"><b>Como usar:</b> no WhatsApp, copie o endereço/link do mapa que o cliente enviou e cole aqui. O app extrai a latitude e longitude e salva no cliente escolhido.</div><select id="locPkg" class="field">'+opts+'</select><textarea id="waText" class="field" rows="6" placeholder="Cole aqui o link/endereço do mapa..."></textarea><div id="preview" class="note" style="display:none"></div><button id="saveLoc" class="btn primary" style="width:100%">📍 SALVAR LOCALIZAÇÃO</button>');if(id)$('locPkg').value=id;$('waText').oninput=()=>{let c=extract($('waText').value);$('preview').style.display=c?'block':'none';if(c)$('preview').innerHTML='Latitude: <b>'+c.lat.toFixed(6)+'</b> • Longitude: <b>'+c.lng.toFixed(6)+'</b>'};$('saveLoc').onclick=()=>{let o=S.orders.find(x=>x.id===$('locPkg').value),c=extract($('waText').value);if(!o||!c)return toast('Não encontrei latitude e longitude nesse mapa.');o.lat=c.lat;o.lng=c.lng;o.fixed=true;save();closeModal();render();draw();toast('📍 Localização salva para '+o.name)}}
function manual(){modal('＋ Nova entrega','<input id="n" class="field" placeholder="Nome do cliente"><input id="a" class="field" placeholder="Endereço"><input id="num" class="field" placeholder="Número"><input id="comp" class="field" placeholder="Complemento"><input id="ph" class="field" inputmode="tel" placeholder="Número do WhatsApp"><button id="add" class="btn primary" style="width:100%">＋ ADICIONAR ENTREGA</button>');$('add').onclick=()=>{let o={id:Date.now().toString(36)+Math.random().toString(36).slice(2),name:$('n').value.trim()||'Cliente',address:$('a').value.trim(),number:$('num').value.trim(),complement:$('comp').value.trim(),phone:$('ph').value.trim(),status:'pending'};if(!o.address)return toast('Informe o endereço.');S.orders.push(o);save();closeModal();render();draw()}}
function importFile(){ $('file').click() }function parseText(t){try{let j=JSON.parse(t);return Array.isArray(j)?j:[j]}catch(e){}return t.trim().split(/\r?\n/).filter(Boolean).map(line=>{let p=line.includes(';')?line.split(';'):line.split(',');return{name:p[0]||'Cliente',address:p[1]||'',number:p[2]||'',complement:p[3]||'',phone:p[4]||'',lat:p[5]?+p[5]:undefined,lng:p[6]?+p[6]:undefined}})}
$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{for(let x of parseText(r.result))S.orders.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),name:x.name||x.nome||'Cliente',address:x.address||x.endereco||x.rua||'',number:x.number||x.numero||'',complement:x.complement||x.complemento||'',phone:x.phone||x.telefone||'',lat:x.lat??x.latitude,lng:x.lng??x.longitude,status:'pending'});save();render();draw();toast('Importação concluída')};r.readAsText(f);e.target.value=''};
function deliver(id){let o=S.orders.find(x=>x.id===id);if(o){o.status='done';save();render();draw();toast('✓ Entrega concluída')}}function fail(id){let o=S.orders.find(x=>x.id===id);if(o){o.status='failed';save();render();draw();toast('Entrega marcada como não entregue')}}function render(){let a=active(),n=current();$('pending').textContent=a.length;$('done').textContent=S.orders.filter(o=>o.status==='done').length;$('failed').textContent=S.orders.filter(o=>o.status==='failed').length;$('day').textContent=a.length?a.length+' entrega'+(a.length===1?'':'s')+' pendente'+(a.length===1?'':'s'):'Adicione seus pacotes para começar.';$('listSub').textContent=S.orders.length+' entrega'+(S.orders.length===1?'':'s');$('nextname').textContent=n?.name||'Nenhum pacote';$('nextaddr').textContent=n?addr(n):'Adicione uma entrega.';$('dist').textContent=n&&gps&&n.lat!=null?fmt(dist(gps,n)):'—';if(!S.orders.length){$('list').innerHTML='<div class="empty">📦 Nenhuma entrega cadastrada.</div>';return}$('list').innerHTML=S.orders.map((o,i)=>{let b=o.status==='done'?'<span class="badge done">ENTREGUE</span>':o.status==='failed'?'<span class="badge fail">NÃO ENTREGUE</span>':'<span class="badge">PENDENTE</span>';return '<div class="pkg"><div class="pkghead"><div class="pkgname">'+esc(o.name||'Cliente')+'</div>'+b+'</div><div class="pkgaddr">📍 '+esc(addr(o))+'</div><div class="phone">📱 '+esc(o.phone||'WhatsApp não informado')+'</div>'+(o.lat!=null?'<div class="coords">📌 Ponto do cliente salvo</div>':'')+'<div class="pkgactions"><button class="btn primary" onclick="goId(\''+o.id+'\')">🧭 IR</button><button class="btn wa" onclick="waId(\''+o.id+'\')">💬 CHAMAR NO WHATS</button><button class="btn loc" onclick="pasteId(\''+o.id+'\')">📋 COLAR MAPA DO WHATS</button><button class="btn ok" onclick="deliver(\''+o.id+'\')">✓ ENTREGUE</button><button class="btn bad" onclick="fail(\''+o.id+'\')">✕ NÃO ENTREGUE</button></div></div>'}).join('')}
function goId(id){go(S.orders.find(o=>o.id===id))}function waId(id){callWa(S.orders.find(o=>o.id===id))}function pasteId(id){pasteWhats(id)}
function finish(){if(!S.orders.length)return toast('Não há entregas para finalizar.');if(!confirm('Finalizar a rota? As entregas irão para o histórico.'))return;S.history=S.history.concat(S.orders.map(o=>({...o,status:o.status==='done'?'done':'failed',finishedAt:new Date().toISOString()})));S.orders=[];S.route=[];save();render();draw();toast('Rota finalizada')}
function history(){let h=S.history||[];modal('🕘 Histórico','<div>'+(h.length?h.map(o=>'<div style="padding:11px 0;border-bottom:1px solid #e6ebf1"><b>'+esc(o.name||'Cliente')+'</b><div class="sub">'+esc(addr(o))+'<br>'+esc(o.phone||'')+' • '+(o.status==='done'?'Entregue':'Não entregue')+'</div></div>').join(''):'<div class="empty">Histórico vazio.</div>')+'</div><button id="clear" class="btn bad" style="width:100%;margin-top:12px">🗑️ APAGAR HISTÓRICO</button>');$('clear').onclick=()=>{if(confirm('Apagar todo o histórico?')){S.history=[];save();closeModal();toast('Histórico apagado')}}}
function openMap(){let g=gps||S.gps;window.open(g?'https://www.openstreetmap.org/?mlat='+g.lat+'&mlon='+g.lng+'#map=16/'+g.lat+'/'+g.lng:'https://www.openstreetmap.org/?locale=pt-BR','_blank')}async function gas(){let g=await getGPS();if(g)window.open('https://www.google.com/maps/search/?api=1&query=postos+de+combustiveis+perto+de+'+g.lat+','+g.lng,'_blank')}function mun(){window.open('https://valparaisodegoias.go.gov.br/wp-content/uploads/2021/07/35e68b34cd18c0ee5c0e8619f08a6c4a.pdf','_blank')}
$('start').onclick=startRoute;$('go').onclick=()=>go();$('arrive').onclick=()=>{let o=current();if(o){o.status='arrived';save();render();toast('📍 Cheguei registrado')}};$('deliver').onclick=()=>{let o=current();if(o)deliver(o.id)};$('finish').onclick=finish;$('manual').onclick=manual;$('import').onclick=importFile;$('photo').onclick=()=>toast('Use MANUAL ou IMPORTAR nesta versão.');$('paste').onclick=()=>pasteWhats();$('hist').onclick=history;$('gas').onclick=gas;$('mapOpen').onclick=openMap;$('mun').onclick=mun;$('close').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};$('fit').onclick=()=>{let p=S.orders.filter(o=>o.lat!=null&&o.lng!=null&&o.status!=='done'&&o.status!=='failed').map(o=>[o.lat,o.lng]);if(gps)p.push([gps.lat,gps.lng]);if(p.length)map.fitBounds(p,{padding:[25,25]})};$('mapGps').onclick=async()=>{let g=await getGPS();if(g){map.setView([g.lat,g.lng],16);draw()}};window.goId=goId;window.waId=waId;window.pasteId=pasteId;window.deliver=deliver;window.fail=fail;gps=S.gps;render();initMap();draw();
</script></body></html>
