<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111d"><title>J&T Turbo V20</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#07111c;color:#eef5fb;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:70px}.app{max-width:900px;margin:auto}.top{position:sticky;top:0;z-index:20;background:#08111df2;border-bottom:1px solid #1d3044;backdrop-filter:blur(14px)}.topin{padding:11px 14px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:19px;font-weight:900}.status{font-size:11px;color:#8fa4b8;margin-top:2px}.pill{font-size:11px;border:1px solid #29445d;border-radius:99px;padding:6px 9px;background:#0d1c2c}.main{padding:10px}.card{background:#0b1928;border:1px solid #1b3045;border-radius:15px;margin-bottom:9px;overflow:hidden}.pad{padding:12px}.hero{background:linear-gradient(135deg,#0c263b,#0b1928)}.hero h2{margin:0 0 3px;font-size:18px}.muted{color:#8fa4b8;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #1b3045;margin-top:11px}.metric{padding:9px 5px;text-align:center;border-right:1px solid #1b3045}.metric:last-child{border:0}.metric b{display:block;font-size:20px}.metric span{font-size:10px;color:#8fa4b8}.next{border-color:#17638c}.nextHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.nextName{font-size:17px;font-weight:850}.nextAddr{color:#a9bac9;font-size:12px;margin-top:3px}.distance{font-size:21px;font-weight:900;color:#37d58a;white-space:nowrap}.actions{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:7px;margin-top:11px}button{border:0;border-radius:10px;background:#15283b;color:#eef5fb;padding:11px 9px;font-weight:800;font-size:12px}button.primary{background:#087cc4}button.green{background:#08764f}button:active{transform:scale(.98)}.mapHead,.listHead{padding:11px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1b3045}.mapHead h3,.listHead h3{margin:0;font-size:15px}.mapTools{display:flex;gap:6px;padding:8px;overflow:auto}.mapTools button{white-space:nowrap;padding:8px 10px;font-size:11px}#map{height:52vh;min-height:360px;background:#dbe4ea}.list{padding:0 12px}.order{display:grid;grid-template-columns:32px 1fr auto;gap:9px;padding:11px 0;border-bottom:1px solid #1b3045;align-items:center}.order:last-child{border-bottom:0}.num{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#087cc4;font-weight:900}.order.done{opacity:.45}.order.done .num{background:#397060}.orderName{font-weight:800}.orderAddr{font-size:11px;color:#8fa4b8;margin-top:2px;line-height:1.35}.tag{font-size:9px;padding:5px 6px;border-radius:99px;background:#26384a;white-space:nowrap}.tag.go{background:#145070}.tag.arr{background:#695018}.tag.ok{background:#126143}.empty{padding:25px 10px;text-align:center;color:#8fa4b8}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#08111df5;border-top:1px solid #1d3044;display:grid;grid-template-columns:repeat(3,1fr);padding:6px}.bottom button{background:transparent;color:#8fa4b8;padding:7px}.bottom button.active{color:#fff;background:#10273c}.toast{position:fixed;z-index:60;left:50%;bottom:80px;transform:translate(-50%,15px);opacity:0;background:#102a40;border:1px solid #31506d;border-radius:11px;padding:10px 13px;transition:.2s;max-width:90%;text-align:center}.toast.on{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;background:#0009;z-index:50;display:none;align-items:flex-end}.modal.on{display:flex}.sheet{width:100%;max-height:88vh;overflow:auto;background:#0a1826;border:1px solid #1d3449;border-radius:19px 19px 0 0;padding:14px}.sheetHead{display:flex;justify-content:space-between;align-items:center}.field{width:100%;padding:11px;background:#07121e;border:1px solid #294158;border-radius:9px;color:#fff;margin:5px 0 9px}.notice{padding:10px;background:#102437;border:1px solid #203b54;border-radius:10px;color:#aebdca;line-height:1.4;margin:8px 0}.wide{width:100%}.candidate{padding:10px 0;border-bottom:1px solid #1b3045}.hidden{display:none!important}@media(max-width:600px){.metrics{grid-template-columns:repeat(4,1fr)}.actions{grid-template-columns:1.2fr 1fr 1fr}.distance{font-size:18px}}
</style></head>
<body>
<header class="top"><div class="app topin"><div><div class="brand">🚚 J&T TURBO <span class="status">V20</span></div><div id="gps" class="status">Preparando…</div></div><div id="routeStatus" class="pill">AUTO</div></div></header>
<main class="app main">
<section class="card hero"><div class="pad"><h2>Hoje</h2><div class="muted">Você olha a próxima entrega. O Turbo cuida do resto.</div></div><div class="metrics"><div class="metric"><b id="mTotal">0</b><span>ENTREGAS</span></div><div class="metric"><b id="mLoc">0</b><span>LOCALIZADAS</span></div><div class="metric"><b id="mPend">0</b><span>PENDENTES</span></div><div class="metric"><b id="mDone">0</b><span>FEITAS</span></div></div></section>
<section class="card next"><div class="pad"><div class="nextHead"><div><div class="muted">PRÓXIMA ENTREGA</div><div id="nextName" class="nextName">Nenhum pedido</div><div id="nextAddr" class="nextAddr">Importe ou cadastre suas entregas.</div></div><div id="nextDist" class="distance">—</div></div><div class="actions"><button class="primary" id="goBtn">🧭 IR</button><button class="green" id="doneBtn">✓ ENTREGUE</button><button id="facadeBtn">🏠 FACHADA</button></div><div id="nextInfo" class="muted" style="margin-top:7px"></div></div></section>
<section class="card" id="mapCard"><div class="mapHead"><div><h3>🗺️ Rota</h3><div id="mapStatus" class="muted">Mapa operacional</div></div><button id="fitBtn">Enquadrar</button></div><div id="map"></div><div class="mapTools"><button id="recalcBtn">↻ Recalcular</button><button id="markBtn">🎯 Marcar casa</button><button id="municipalBtn">Mapa municipal</button></div></section>
<section class="card" id="ordersCard"><div class="listHead"><div><h3>📦 Entregas</h3><div id="listSub" class="muted">Nenhuma entrega</div></div><button id="addBtn">＋ Adicionar</button></div><div id="orders" class="list"></div></section>
</main>
<nav class="bottom"><button class="active" id="homeTab">🏠<br>Hoje</button><button id="ordersTab">📦<br>Entregas</button><button id="moreTab">☰<br>Mais</button></nav>
<div id="toast" class="toast"></div><div id="modal" class="modal"><div class="sheet"><div class="sheetHead"><h3 id="mt">J&T Turbo</h3><button id="close">Fechar</button></div><div id="mb"></div></div></div>
<input id="importFile" type="file" accept=".csv,.txt,.json" hidden><input id="photoFile" type="file" accept="image/*" capture="environment" hidden>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';
const KEY='jtTurboV20', OLD='jtTurboV19', CENTER=[-16.0651,-47.9757], CITY='Valparaíso de Goiás, GO, Brasil';
let S=load(), map=null, layer=null, line=null, watch=null, selected=null, toastTimer=null;
function load(){try{let raw=localStorage.getItem(KEY)||localStorage.getItem(OLD);let s=raw?JSON.parse(raw):{};s.orders=(s.orders||[]).map(o=>Object.assign({status:'pending'},o));s.route=s.route||[];s.addressMemory=s.addressMemory||{};s.history=s.history||[];s.settings=Object.assign({arrivalRadius:90},s.settings||{});return s}catch(e){return{orders:[],route:[],addressMemory:{},history:[],settings:{arrivalRadius:90}}}}
function save(){localStorage.setItem(KEY,JSON.stringify(S));render();drawMap()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('on'),3500)}
function modal(t,h){document.getElementById('mt').textContent=t;document.getElementById('mb').innerHTML=h;document.getElementById('modal').classList.add('on')}
function closeModal(){document.getElementById('modal').classList.remove('on')}
function addr(o){return[o.address,o.number,o.complement,o.sector,o.city||'Valparaíso de Goiás',o.state||'GO'].filter(Boolean).join(', ')}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\bqd\s*[:.]?\s*(\d+[A-Za-z]?)\b/ig,'Quadra $1').replace(/\bq(?:uadra)?\s*[:.]?\s*(\d+[A-Za-z]?)\b/ig,'Quadra $1').replace(/\br(?:ua)?\s*[:.]?\s*(\d+[A-Za-z]?)\b/ig,'Rua $1').replace(/\s+/g,' ').trim()}
function parseQR(s){let t=String(s||'');return{q:(t.match(/\b(?:q|qd|quadra)\s*[:.]?\s*(\d+[A-Za-z]?)\b/i)||[])[1]||'',r:(t.match(/\b(?:r|rua)\s*[:.]?\s*(\d+[A-Za-z]?)\b/i)||[])[1]||''}}
function key(o){return norm([o.address,o.number,o.sector].filter(Boolean).join(' ')).toLowerCase()}
function dist(a,b){const R=6371000,dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lng-a.lng)*Math.PI/180,x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function nextOrder(){let a=S.orders.filter(o=>o.status!=='done');for(let id of S.route){let o=a.find(x=>x.id===id);if(o)return o}if(S.gps)return a.filter(o=>o.lat!=null).sort((x,y)=>dist(S.gps,x)-dist(S.gps,y))[0]||a[0];return a[0]}
function initMap(){if(map)return;if(typeof L==='undefined'){document.getElementById('mapStatus').textContent='Mapa não carregou a biblioteca. Recarregue a página.';return}map=L.map('map',{zoomControl:true}).setView(CENTER,13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);layer=L.layerGroup().addTo(map);map.on('click',e=>{if(selected){setPin(selected,e.latlng.lat,e.latlng.lng);selected=null}});setTimeout(()=>map.invalidateSize(),200)}
function pinIcon(n,done){return L.divIcon({className:'',html:'<div style="width:31px;height:31px;border-radius:50%;background:'+(done?'#527366':'#087cc4')+';border:3px solid #fff;color:#fff;display:grid;place-items:center;font-weight:900;box-shadow:0 2px 8px #0008">'+n+'</div>',iconSize:[31,31],iconAnchor:[15,15]})}
function drawMap(){initMap();if(!map||!layer)return;layer.clearLayers();if(line){line.remove();line=null}S.orders.forEach((o,i)=>{if(o.lat==null||o.lng==null)return;let n=S.route.indexOf(o.id);n=n>=0?n+1:i+1;L.marker([o.lat,o.lng],{icon:pinIcon(n,o.status==='done')}).addTo(layer).bindPopup('<b>'+esc(o.name||'Cliente')+'</b><br>'+esc(addr(o))+'<br><br><button onclick="go(\''+o.id+'\')">🧭 IR</button> <button onclick="complete(\''+o.id+'\')">✓ Entregue</button>')});if(S.gps)L.circleMarker([S.gps.lat,S.gps.lng],{radius:8,weight:3,color:'#fff',fillOpacity:1}).addTo(layer).bindPopup('📍 Você está aqui');if(S.routeGeo)line=L.geoJSON(S.routeGeo,{style:{weight:5,opacity:.8}}).addTo(map)}
function fit(){initMap();let p=S.orders.filter(o=>o.lat!=null&&o.lng!=null&&o.status!=='done').map(o=>[o.lat,o.lng]);if(S.gps)p.push([S.gps.lat,S.gps.lng]);if(p.length)map.fitBounds(L.latLngBounds(p).pad(.15));else map.setView(CENTER,13)}
function startGPS(){if(!navigator.geolocation){document.getElementById('gps').textContent='GPS indisponível';return}if(watch!=null)return;navigator.geolocation.getCurrentPosition(p=>setGPS(p),()=>{}, {enableHighAccuracy:true,timeout:12000});watch=navigator.geolocation.watchPosition(setGPS,e=>{document.getElementById('gps').textContent=e.code===1?'GPS bloqueado':'GPS aguardando'},{enableHighAccuracy:true,maximumAge:2000,timeout:20000})}
function setGPS(p){S.gps={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,at:Date.now()};document.getElementById('gps').textContent='📍 GPS ativo • ±'+Math.round(p.coords.accuracy||0)+' m';localStorage.setItem(KEY,JSON.stringify(S));drawMap();autoArrival();render()}
function autoArrival(){let o=nextOrder();if(!o||o.lat==null||!S.gps)return;let d=dist(S.gps,o);if(d<=Number(S.settings.arrivalRadius||90)&&o.status!=='arrived'){o.status='arrived';o.arrivedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(S));toast('🏠 Chegou: '+(o.name||'cliente'));}}
function go(id){let o=S.orders.find(x=>x.id===id)||nextOrder();if(!o)return toast('Nenhuma entrega disponível.');o.status='going';S.route=[o.id,...S.route.filter(x=>x!==o.id)];save();let dest=o.lat!=null?o.lat+','+o.lng:encodeURIComponent(addr(o));window.open('https://www.google.com/maps/dir/?api=1&destination='+dest+'&travelmode=driving','_blank');}
function complete(id){let o=S.orders.find(x=>x.id===id)||nextOrder();if(!o)return;o.status='done';o.doneAt=Date.now();S.history.push({date:new Date().toISOString(),id:o.id,name:o.name,address:addr(o),source:o.locationSource||'sem localização'});S.route=S.route.filter(x=>x!==o.id);save();toast('✓ '+(o.name||'Entrega')+' concluída');setTimeout(routeOrder,300)}
function facade(){let o=nextOrder();if(!o)return;if(o.lat==null)return toast('Primeiro localize esta entrega.');window.open('https://www.google.com/maps/@?api=1&map_action=pano&viewpoint='+o.lat+','+o.lng,'_blank')}
function setPin(id,lat,lng){let o=S.orders.find(x=>x.id===id);if(!o)return;o.lat=lat;o.lng=lng;o.locationSource='manual';S.addressMemory[key(o)]={lat,lng,source:'confirmed',at:Date.now()};save();toast('🧠 Ponto salvo. Nas próximas vezes o Turbo reconhece este endereço.')}
function mark(){let o=nextOrder()||S.orders.find(x=>x.lat==null);if(!o)return toast('Não há entrega para marcar.');selected=o.id;document.getElementById('mapCard').scrollIntoView({behavior:'smooth'});toast('🎯 Toque no ponto da casa no mapa.')}
async function locate(o){let k=key(o);if(S.addressMemory[k]){let m=S.addressMemory[k];o.lat=m.lat;o.lng=m.lng;o.locationSource='memory';return true}let qr=parseQR(o.address),q=[];if(qr.q&&qr.r)q.push('Quadra '+qr.q+' Rua '+qr.r);if(o.address)q.push(o.address+(o.number?', '+o.number:''));for(let text of q){try{let u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=br&q='+encodeURIComponent(text+', '+CITY);let r=await fetch(u);let j=await r.json();if(j[0]){o.lat=+j[0].lat;o.lng=+j[0].lon;o.locationSource='geocode';S.addressMemory[k]={lat:o.lat,lng:o.lng,source:'geocode',at:Date.now()};return true}}catch(e){}}return false}
async function locateAll(){let a=S.orders.filter(o=>o.status!=='done'&&o.lat==null);if(!a.length)return toast('Todas as entregas já têm localização.');for(let o of a){document.getElementById('mapStatus').textContent='Localizando '+(o.name||'cliente')+'…';await locate(o);render();drawMap();await new Promise(r=>setTimeout(r,700))}routeOrder();toast('📍 Localização automática concluída.')}
async function routeOrder(){let a=S.orders.filter(o=>o.status!=='done'&&o.lat!=null&&o.lng!=null);if(!a.length)return;let cur=S.gps||{lat:a[0].lat,lng:a[0].lng},out=[],left=[...a];while(left.length){left.sort((x,y)=>dist(cur,x)-dist(cur,y));let n=left.shift();out.push(n.id);cur=n}S.route=out;try{let coords=out.map(id=>{let o=S.orders.find(x=>x.id===id);return o.lng+','+o.lat}).join(';');let r=await fetch('https://router.project-osrm.org/route/v1/driving/'+coords+'?overview=full&geometries=geojson');let j=await r.json();if(j.code==='Ok'){S.routeGeo=j.routes[0].geometry;document.getElementById('routeInfo');document.getElementById('mapStatus').textContent=(j.routes[0].distance/1000).toFixed(1)+' km • '+Math.round(j.routes[0].duration/60)+' min'}}catch(e){S.routeGeo=null}save()}
function render(){let total=S.orders.length,loc=S.orders.filter(o=>o.lat!=null).length,pend=S.orders.filter(o=>o.status!=='done').length,done=S.orders.filter(o=>o.status==='done').length;document.getElementById('mTotal').textContent=total;document.getElementById('mLoc').textContent=loc;document.getElementById('mPend').textContent=pend;document.getElementById('mDone').textContent=done;let o=nextOrder();document.getElementById('nextName').textContent=o?(o.name||'Cliente'):'Nenhum pedido';document.getElementById('nextAddr').textContent=o?addr(o):'Importe ou cadastre suas entregas.';document.getElementById('nextDist').textContent=o&&S.gps&&o.lat!=null?(dist(S.gps,o)/1000).toFixed(1)+' km':'—';document.getElementById('nextInfo').textContent=o?(o.status==='arrived'?'📍 Você está no local.':o.status==='going'?'🧭 Em deslocamento.':o.lat!=null?'🟢 Localização disponível':'🔴 Precisa localizar'):'Tudo pronto para começar.';document.getElementById('listSub').textContent=total?pend+' pendentes • '+done+' concluídas':'Nenhuma entrega';let active=S.route;document.getElementById('orders').innerHTML=S.orders.length?S.orders.map((x,i)=>{let n=active.indexOf(x.id);n=n>=0?n+1:i+1;let tag=x.status==='done'?'CONCLUÍDA':x.status==='arrived'?'CHEGUEI':x.status==='going'?'A CAMINHO':'PENDENTE';return '<div class="order '+(x.status==='done'?'done':'')+'"><div class="num">'+n+'</div><div><div class="orderName">'+esc(x.name||'Cliente')+'</div><div class="orderAddr">'+esc(addr(x))+'</div></div><div class="tag '+(x.status==='done'?'ok':x.status==='arrived'?'arr':x.status==='going'?'go':'')+'">'+tag+'</div></div>'}).join(''):'<div class="empty">📦<br><br>Nenhuma entrega ainda.<br>Use <b>＋ Adicionar</b> ou importe sua lista.</div>'}
function add(){modal('＋ Nova entrega','<label>Nome</label><input id="n" class="field" placeholder="João Silva"><label>WhatsApp</label><input id="p" class="field" placeholder="61999999999"><label>Endereço / Q/R</label><input id="a" class="field" placeholder="Q123 R75"><label>Número</label><input id="nu" class="field" placeholder="10"><label>Complemento</label><input id="c" class="field" placeholder="Casa / lote"><button class="primary wide" id="saveAdd">SALVAR</button>');document.getElementById('saveAdd').onclick=async()=>{let o={id:'o'+Date.now(),name:n.value.trim()||'Cliente',phone:p.value.trim(),address:norm(a.value),number:nu.value.trim(),complement:c.value.trim(),status:'pending',createdAt:Date.now()};S.orders.push(o);closeModal();save();await locate(o);save();routeOrder();toast(o.lat?'📍 Salvo e localizado.':'⚠️ Salvo; localização pendente.')}}
function more(){modal('☰ Mais','<button class="wide" id="imp">📦 Importar lista</button><button class="wide" id="wa" style="margin-top:7px">💬 Pedir localização no WhatsApp</button><button class="wide" id="mem" style="margin-top:7px">🧠 Memória de endereços</button><button class="wide" id="gas" style="margin-top:7px">⛽ Postos próximos</button><div class="notice">O Turbo já trabalha automaticamente: GPS, localização, sequência da rota e CHEGUEI por proximidade. Estes itens ficam aqui para quando você precisar interferir.</div>');document.getElementById('imp').onclick=()=>{closeModal();document.getElementById('importFile').click()};document.getElementById('wa').onclick=wa;document.getElementById('mem').onclick=memory;document.getElementById('gas').onclick=gas}
function wa(){let a=S.orders.filter(o=>o.status!=='done'&&o.phone);if(!a.length)return toast('Nenhum telefone cadastrado.');modal('💬 WhatsApp',a.map(o=>'<div class="candidate"><b>'+esc(o.name||'Cliente')+'</b><div class="muted">'+esc(addr(o))+'</div><button class="primary wide" onclick="askWA(\''+o.id+'\')">📍 Pedir localização</button></div>').join(''))}
function askWA(id){let o=S.orders.find(x=>x.id===id);if(!o)return;let p=String(o.phone).replace(/\D/g,'');if(p.length===10||p.length===11)p='55'+p;window.open('https://wa.me/'+p+'?text='+encodeURIComponent('Olá! 🚚 Sou da J&T Turbo. Pode enviar sua localização atual pelo WhatsApp? 📍'),'_blank')}
function memory(){modal('🧠 Memória','<div class="notice">'+Object.keys(S.addressMemory).length+' endereços aprendidos neste aparelho.<br><br>Quando você marca uma casa no mapa, o ponto é guardado e usado antes de uma nova busca.</div>')}
async function gas(){if(!S.gps)return toast('Ligue o GPS para procurar postos próximos.');modal('⛽ Postos próximos','<div id="gasList">Consultando…</div>');try{let q='[out:json];node[amenity=fuel](around:5000,'+S.gps.lat+','+S.gps.lng+');out;';let r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:q}),j=await r.json();let a=j.elements.map(x=>({n:x.tags?.name||'Posto',lat:x.lat,lng:x.lon,d:dist(S.gps,{lat:x.lat,lng:x.lon})})).sort((x,y)=>x.d-y.d).slice(0,8);document.getElementById('gasList').innerHTML=a.length?a.map(x=>'<div class="candidate"><b>⛽ '+esc(x.n)+'</b><div class="muted">'+Math.round(x.d)+' m</div></div>').join(''):'Nenhum encontrado.'}catch(e){document.getElementById('gasList').textContent='Consulta indisponível agora.'}}
function municipal(){modal('Mapa municipal','<div class="notice">Use o mapa municipal para resolver uma dúvida de Q/R. Depois marque a casa no mapa do Turbo para transformar a correção em memória.</div><p class="muted">O arquivo municipal deve existir em <b>v19/mapa-valparaiso-goias.pdf</b>. Se não existir, esta tela não inventa um mapa.</p>')}
function importList(){document.getElementById('importFile').click()}
document.getElementById('importFile').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;let t=await f.text();try{let arr=f.name.toLowerCase().endsWith('.json')?JSON.parse(t):(t.split(/\r?\n/).filter(Boolean).slice(1).map(line=>{let v=line.split(/[,;]/);return{name:v[0],phone:v[1],address:v[2],number:v[3],sector:v[4]}}));arr=(arr.orders||arr);arr.forEach(x=>S.orders.push({id:'o'+Date.now()+Math.random(),name:x.name||x.nome||'Cliente',phone:x.phone||x.telefone||'',address:norm(x.address||x.endereco||''),number:x.number||x.numero||'',sector:x.sector||x.setor||'',status:'pending',createdAt:Date.now()}));save();locateAll();toast(arr.length+' pedidos adicionados.')}catch(e){toast('Não consegui ler a lista.')}};
function boot(){initMap();render();drawMap();startGPS();setTimeout(()=>{if(S.orders.some(o=>o.status!=='done'&&o.lat==null))locateAll();else routeOrder()},1200)}
goBtn.onclick=()=>go();doneBtn.onclick=()=>complete();facadeBtn.onclick=facade;fitBtn.onclick=fit;recalcBtn.onclick=routeOrder;markBtn.onclick=mark;municipalBtn.onclick=municipal;addBtn.onclick=add;moreTab.onclick=more;ordersTab.onclick=()=>document.getElementById('ordersCard').scrollIntoView({behavior:'smooth'});homeTab.onclick=()=>scrollTo({top:0,behavior:'smooth'});close.onclick=closeModal;boot();setInterval(()=>{autoArrival();render()},15000);
</script></body></html>
